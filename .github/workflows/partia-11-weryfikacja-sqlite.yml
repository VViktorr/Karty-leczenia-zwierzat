name: "Partia 11 - odczyt SQLite i 35 brakow"
run-name: "Partia 11 - diagnostyka aktualnej bazy (bez zmian)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostyka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: false
      - name: "Odczyt bazy, 10 grup i 35 pozycji bez liczby"
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, re, pathlib, csv, json, hashlib
          root=pathlib.Path.cwd()
          path=root/'src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          assert path.is_file(), 'Brak SQLite - przerwano'
          original_hash=hashlib.sha256(path.read_bytes()).hexdigest()
          db=sqlite3.connect(f'file:{path}?mode=ro', uri=True)
          db.row_factory=sqlite3.Row
          cols={r['name'] for r in db.execute("PRAGMA table_info(variants)")}
          print('Kolumny variants:',sorted(cols))
          assert {'id','name','species','dose'}.issubset(cols), 'Nieoczekiwany schemat variants'
          integrity=db.execute('PRAGMA integrity_check').fetchone()[0]
          fk=db.execute('PRAGMA foreign_key_check').fetchall()
          assert integrity=='ok' and not fk, 'Nieprawidlowa integralnosc bazy'
          rows=[dict(r) for r in db.execute('SELECT * FROM variants ORDER BY id')]
          def inactive(r):
              # Flag and status may vary; report counts for human review.
              for col in ('is_archived','archived','is_inactive','inactive','deleted'):
                  if col in cols and r[col] not in (None,0,'0','',False):
                      return True
              for col in ('status','variant_status','state'):
                  if col in cols and str(r[col] or '').lower().strip() in ('archiwalny','archiwalne','archived','inactive','deleted'):
                      return True
              return False
          active=[r for r in rows if not inactive(r)]
          def has_number(s): return bool(re.search(r'\d',str(s or '')))
          no_number=[r for r in active if not has_number(r.get('dose'))]
          groups=[
            ('Febrivac Dist','Febrivac'),('IBR Marker zywy','IBR marker'),
            ('Nerfasin','Nerfasin'),('Nobivac DHPPi','Nobivac DHPPi'),
            ('Nobivac Tricat Trio','Nobivac Tricat'),
            ('Oxyflex XLA','Oxyflex'),('Polocainum 5%','Polocainum'),
            ('Pyralgivet','Pyralgivet'),('Rispoval 3','Rispoval 3'),('Wellicox','Wellicox')]
          def matches(row, term):
              return term.casefold() in str(row.get('name') or '').casefold()
          def pdf_status(r):
              p=r.get('pdf_path')
              if not p: return 'brak powiazania'
              target=root/str(p)
              if not target.is_file(): return 'brak pliku'
              with target.open('rb') as f: head=f.read(8)
              if not head.startswith(b'%PDF-'): return 'nieprawidlowy naglowek'
              return 'naglowek PDF OK (tresc niezweryfikowana)'
          def classify(r):
              t=str(r.get('dose') or '').casefold()
              if re.search(r'nie stosowac|nie podawac|przeciwwskazan|zakaz',t): return 'celowe: nie stosowac (do potwierdzenia)'
              if t.strip() and re.search(r'zgodnie|wedlug|wg |dobier|indywidual|zalezn|w razie',t): return 'opisowe (do potwierdzenia)'
              return 'prawdopodobny brak (do weryfikacji)'
          out=pathlib.Path('partia11_wyniki');out.mkdir(exist_ok=True)
          keys=['id','symbol','name','species','indication','route','dose','card_text','rpl_id','pdf_path']
          with (out/'bez_liczby.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f,delimiter=';');w.writerow(keys+['klasyfikacja_wstepna'])
              for r in no_number: w.writerow([r.get(k,'') for k in keys]+[classify(r)])
          with (out/'partia11_warianty.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f,delimiter=';');w.writerow(['grupa']+keys+['pdf_status'])
              for group,term in groups:
                  for r in active:
                      if matches(r,term): w.writerow([group]+[r.get(k,'') for k in keys]+[pdf_status(r)])
          lines=['# Partia 11 — odczyt biezacej SQLite','',
                 f'- SHA256: `{original_hash}`',
                 f'- Integralnosc: `{integrity}`, foreign_key_check: `{len(fk)}` bledow',
                 f'- Warianty ogolem: **{len(rows)}**, aktywne wg wykrytych flag: **{len(active)}**, archiwalne: **{len(rows)-len(active)}**',
                 f'- Bez liczby w dawce: **{len(no_number)}** (szczegoly w CSV)', '',
                 '## Dziesiec grup','',
                 '| Grupa | Aktywne | Odeslania do ChPL/ulotki | Problemy sciezki/naglowka PDF |','|---|---:|---:|---:|']
          total_refs=0
          for group,term in groups:
              rr=[r for r in active if matches(r,term)]
              references=sum(bool(re.search('chpl|ulotk',str(r.get('dose') or ''),re.I)) for r in rr)
              total_refs+=references
              issues=sum(not pdf_status(r).startswith('naglowek PDF OK') for r in rr)
              lines.append(f'| {group} | {len(rr)} | {references} | {issues} |')
          lines+=['',f'- Odeslania w 10 grupach: **{total_refs}**',
                  '', '## 35 pozycji bez liczby — klasyfikacja wstepna','',
                  '| ID | Produkt | Gatunek | Ocena robocza |','|---:|---|---|---|']
          for r in no_number:
              clean=lambda s: str(s or '').replace('|','/').replace('\n',' ')[:95]
              lines.append(f"| {r['id']} | {clean(r.get('name'))} | {clean(r.get('species'))} | {classify(r)} |")
          lines+=['','Klasyfikacja jest automatyczna i wymaga oceny klinicznej. Weryfikacja naglowka PDF nie potwierdza prawidlowosci dokumentu ani schematu leczenia.',
                  '', 'Ten workflow nie zapisuje ani nie modyfikuje SQLite; nie uruchamia kompilacji.']
          (out/'raport.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          db.close()
          assert hashlib.sha256(path.read_bytes()).hexdigest()==original_hash, 'Baza zmienila sie!'
          print('\n'.join(lines[:22]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: partia11-wyniki-sqlite
          path: partia11_wyniki/
          retention-days: 7
