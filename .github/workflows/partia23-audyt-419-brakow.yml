name: "Partia 23 - audyt 419 brakow PDF i klasyfikacja 30 grup"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: false
      - name: "Czytnik PDF"
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: "Skategoryzuj wszystkie braki i przygotuj 30 grup"
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import csv, hashlib, json, re, sqlite3, unicodedata
          import fitz
          
          root=Path.cwd()
          dbpath=root/"src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite"
          sha_before=hashlib.sha256(dbpath.read_bytes()).hexdigest()
          db=sqlite3.connect(f"file:{dbpath}?mode=ro",uri=True)
          db.row_factory=sqlite3.Row
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          rows=[dict(x) for x in db.execute("SELECT id,name,rpl_id,species,pdf_path,scope FROM variants ORDER BY id")]
          assert len(rows)==2944
          active=[r for r in rows if "archiwal" not in str(r["scope"] or "").casefold()]
          assert len(active)==2902
          def valid_pdf(p):
              return p.is_file() and p.read_bytes()[:5]==b"%PDF-"
          def normalize(v):
              raw=unicodedata.normalize("NFKD",str(v or "").casefold())
              return re.sub(r"[^a-z0-9]+"," ","".join(ch for ch in raw if not unicodedata.combining(ch))).strip()
          missing=[]
          for r in active:
              linked=str(r["pdf_path"] or "").strip()
              if not linked or not valid_pdf(root/linked):
                  missing.append(r)
          assert len(missing)==419, f"Oczekiwano 419 brakow po partii 22, jest {len(missing)}"
          groups=defaultdict(list)
          for r in missing:
              groups[str(r["rpl_id"] or "").strip()].append(r)
          
          pdfs=list((root/"data/ChPL/RPL").glob("RPL_*.pdf"))
          pdfs_by_rpl=defaultdict(list)
          for f in pdfs:
              m=re.match(r"RPL_(\d+)_",f.name)
              if m: pdfs_by_rpl[m.group(1)].append(f)
          pdf_cache={}
          def probe(file):
              if file in pdf_cache:return pdf_cache[file]
              result={"file":file.relative_to(root).as_posix(),"pages":0,"text":"","problem":""}
              if not valid_pdf(file):result["problem"]="niepoprawny naglowek PDF"
              else:
                  try:
                      with fitz.open(file) as doc:
                          result["pages"]=len(doc)
                          if doc.is_encrypted or not (2<=len(doc)<=100):
                              result["problem"]="PDF zaszyfrowany lub niewlasciwa liczba stron"
                          else:
                              result["text"]=normalize(" ".join(p.get_text(sort=True) for p in doc))
                              if len(result["text"])<300:
                                  result["problem"]="niewystarczajacy tekst PDF"
                              elif "charakterystyk" not in result["text"]:
                                  result["problem"]="brak naglowka ChPL w PDF"
                  except Exception as exc:result["problem"]="nie mozna odczytac: "+str(exc)[:120]
              pdf_cache[file]=result
              return result
          
          records=[]
          for rpl,items in sorted(groups.items(),key=lambda kv:(-len(kv[1]),kv[0])):
              names=sorted(set(str(x["name"] or "") for x in items))
              docs=pdfs_by_rpl.get(rpl,[])
              reason=""
              detail=""
              file=""
              pages=0
              if not re.fullmatch(r"\d{4,12}",rpl):
                  reason="BRAK_JEDNOZNACZNEGO_RPL"
              elif not docs:
                  reason="BRAK_PDF_RPL_W_REPO"
              elif len(docs)>1:
                  reason="WIELE_PDF_DLA_RPL"
                  detail=" | ".join(f.name for f in docs[:6])
              else:
                  doc=probe(docs[0])
                  file=doc["file"];pages=doc["pages"]
                  if doc["problem"]:
                      reason="NIECZYTELNA_LUB_NIEPRAWIDLOWA_CHPL"
                      detail=doc["problem"]
                  elif any(re.search(r"(?i)candidates|kandydac|(?:or|lub)\s+[0-9]{4,}",name) for name in names):
                      reason="NIEJEDNOZNACZNY_OPIS_PRODUKTU"
                  else:
                      candidates={}
                      for name in names:
                          tokens=[w for w in normalize(name).split() if len(w)>=5 and w not in {
                              "roztwor","proszek","zawiesina","iniekcji","wstrzykiwan",
                              "kapsulki","tabletki","tabletke","weterynaryjny","substancja"}]
                          candidates[name]=tokens[:3]
                      if not all(tok and re.search(r"\b"+re.escape(tok[0])+r"\b",doc["text"]) for tok in candidates.values()):
                          reason="NAZWA_NIEZGODNA_Z_CHPL"
                          detail=json.dumps(candidates,ensure_ascii=False)[:450]
                      else:
                          reason="POTENCJALNE_DOPASOWANIE_DO_RECZNEJ_OCENY"
                          detail="Pozytywna kontrola pierwszego tokenu; wymagane potwierdzenie identycznosci preparatu"
              records.append({"rpl":rpl,"names":names,"variants":len(items),
                  "ids":[x["id"] for x in items],"reason":reason,"detail":detail,
                  "pdf":file,"pages":pages})
          assert sum(x["variants"] for x in records)==419
          cnt=Counter()
          groupcnt=Counter()
          for r in records:
              cnt[r["reason"]]+=r["variants"]
              groupcnt[r["reason"]]+=1
          
          report_dir=Path("partia23_raport")
          report_dir.mkdir(exist_ok=True)
          with (report_dir/"wszystkie_braki.csv").open("w",encoding="utf-8-sig",newline="") as fd:
              wr=csv.writer(fd,delimiter=";")
              wr.writerow(["RPL","Nazwa","Liczba wariantow","ID wariantow","Kategoria","Szczegoly","Plik ChPL","Strony"])
              for x in records:
                  wr.writerow([x["rpl"]," | ".join(x["names"]),x["variants"],",".join(map(str,x["ids"])),x["reason"],x["detail"],x["pdf"],x["pages"]])
          summary={"source_sha256":sha_before,"total_variants":len(rows),"active_variants":len(active),
                   "missing":len(missing),"groups":len(records),
                   "by_reason_variant_count":dict(cnt),"by_reason_group_count":dict(groupcnt),
                   "first_30_groups":records[:30],"all_groups":records}
          (report_dir/"partia23.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf8")
          lines=["# Partia 23: klasyfikacja 419 brakow ChPL","",
              "Ten przebieg niczego nie dopina do SQLite; przygotowuje material do odrebnej, zweryfikowanej partii zmian.",
              f"SQLite: {len(rows)} wariantow, w tym {len(active)} aktywnych.",
              f"Brak poprawnego powiazania ChPL: **{len(missing)} wariantow**, w **{len(records)} grupach RPL**.",
              "","## Przyczyny","",
              "| Przyczyna | Warianty | Grupy |","|---|---:|---:|"]
          for k,v in cnt.most_common():
              lines.append(f"| {k} | {v} | {groupcnt[k]} |")
          lines.extend(["","## Pierwsze 30 grup do nastepnej oceny","",
              "| RPL | Lek | Warianty | Klasyfikacja |","|---|---|---:|---|"])
          for x in records[:30]:
              lines.append(f"| {x['rpl']} | {x['names'][0].replace('|','/')} | {x['variants']} | {x['reason']} |")
          lines+=["","Oceniaj produkty i RPL oddzielnie; identyczny pierwszy czlon nazwy nie potwierdza identycznej mocy ani postaci.",
                  "Szczegoly: partia23.json i wszystkie_braki.csv.",
                  "SHA256 SQLite: "+sha_before]
          (report_dir/"partia23.md").write_text("\n".join(lines)+"\n",encoding="utf8")
          assert hashlib.sha256(dbpath.read_bytes()).hexdigest()==sha_before
          print("\n".join(lines))
          db.close()
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: partia23-audyt-brakow-pdf
          path: partia23_raport/
          retention-days: 14
