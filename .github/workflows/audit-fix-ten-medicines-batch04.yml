name: Partia 04 - dawkowanie i audyt 10 lekow
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-ten-batch04
  cancel-in-progress: false
jobs:
  audit-and-correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Jednoczesny audyt 10 lekow i bezpieczna korekta dawek
        run: python scripts/audit-fix-ten-medicines-batch04.py
      - name: Commit wynikow do winforms bez kompilacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_10_lekow_partia_04_SQLite.md
          if git diff --cached --quiet; then
            echo 'Brak zmian'
            exit 0
          fi
          git commit -m 'fix: 10 medicines batch04 Enrocin Enroxil dosing RPL [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
