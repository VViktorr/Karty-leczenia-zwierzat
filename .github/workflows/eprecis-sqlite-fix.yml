name: Korekta EPRECIS w bazie SQLite
on:
  push:
    branches: [winforms]
    paths:
      - '.github/workflows/eprecis-sqlite-fix.yml'
permissions:
  contents: write
jobs:
  correct-catalog:
    if: contains(github.event.head_commit.message, 'apply EPRECIS SQLite correction')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aktualizuj tylko EPRECIS 100 ML i sprawdź integralność
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          path = Path("src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite")
          assert path.is_file(), f"Brak bazy: {path}"
          db=sqlite3.connect(path)
          db.execute("PRAGMA foreign_keys=ON")
          symbol="000000000000002061"
          source="https://rejestrymedyczne.ezdrowie.gov.pl/api/rpl/medicinal-products/35888/characteristic"
          variants={
              "Bydło":("63 dni","tk. 63 dni, ml. 0 h",""),
              "Kozy":("42 dni","tk. 42 dni, ml. 0 h","U kóz nie przekraczać 0,6 ml w jednym miejscu podania."),
              "Owce":("42 dni","tk. 42 dni, ml. 0 h",""),
          }
          indication="Leczenie inwazji pasożytów wewnętrznych i zewnętrznych wrażliwych na eprynomektynę, zgodnie z wykazem gatunkowym w ChPL."
          route="Podskórnie (s.c.)"
          dose="Jednorazowo 0,2 mg eprynomektyny/kg m.c. = 0,1 ml/10 kg masy ciała."
          general="Przy fiolce 100 ml nie przekraczać 30 wkłuć; w razie potrzeby stosować igłę do odciągania."
          db.execute("BEGIN IMMEDIATE")
          assert db.execute("SELECT COUNT(*) FROM products WHERE symbol=?",(symbol,)).fetchone()[0]==1
          rows=db.execute("SELECT id,species FROM variants WHERE symbol=?",(symbol,)).fetchall()
          assert len(rows)==3 and set(sp for _,sp in rows)==set(variants), f"Zmieniona lista wariantów, bezpiecznie przerwano: {rows}"
          before=db.execute("SELECT COUNT(*) FROM variants").fetchone()[0]
          db.execute("UPDATE products SET rpl_id=?,upd_id=NULL,status=? WHERE symbol=?",(
              "35888","Opracowano — EPRECIS 20 mg/ml do wstrzykiwań; 3 warianty RPL 35888",symbol))
          for vid,species in rows:
              tissues,short,extra=variants[species]
              restrictions=(general+" "+extra).strip()
              text=f"{species} · {indication} · {route} · {dose} · Tkanki: {tissues} · Mleko: 0 godzin · {restrictions}"
              db.execute("""UPDATE variants SET name=?,rpl_id=?,upd_id=NULL,indication=?,route=?,dose=?,
                edible_tissues=?,milk=?,restrictions=?,source=?,verified_at=?,card_text=?,pdf_path=NULL,withdrawal_short=?
                WHERE id=? AND symbol=?""",(
                  "Eprecis 20 mg/ml, roztwór do wstrzykiwań","35888",indication,route,dose,
                  tissues,"0 godzin",restrictions,source,"2026-11-15",text,short,vid,symbol))
              db.execute("INSERT OR REPLACE INTO price_withdrawal_entries(id,compact_text) VALUES (?,?)",(vid,short))
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert db.execute("PRAGMA foreign_key_check").fetchall()==[]
          assert db.execute("SELECT COUNT(*) FROM variants").fetchone()[0]==before
          db.commit()
          print("Zaktualizowano",[(sp,variants[sp][0]) for _,sp in rows])
          db.close()
          PY
      - name: Commit bazy bez kompilacji aplikacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet && exit 0
          git commit -m 'fix: EPRECIS 100 ML, warianty i karencje w SQLite [skip ci]'
          git push origin HEAD:winforms
