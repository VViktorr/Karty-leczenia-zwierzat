name: "Partia 42 - nowe polskie ChPL Naxcel Metacam Stronghold Simparica"
on:
  push:
    branches: [winforms]
    paths:
      - ".github/workflows/partia42-zbiorcze-pdf.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia42
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
      - name: Install PDF library
        run: python -m pip install --disable-pip-version-check "pymupdf>=1.24,<3"
      - name: Verify Polish combined SPC documents by product name, strength, form and species
        run: python scripts/partia42-nowe-zbiorcze-pdf.py
      - name: Persist verified links only, with full report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia42_nowe_zbiorcze_pdf_wynik.json
          git add -f data/audyt_brakujacych_pdf/partia42_nowe_zbiorcze_pdf_nazwy_subiekt.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: partia42 nowe zbiorcze ChPL i powiazania [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia42-raport
          path: |
            data/audyt_brakujacych_pdf/partia42_nowe_zbiorcze_pdf_wynik.json
            data/audyt_brakujacych_pdf/partia42_nowe_zbiorcze_pdf_nazwy_subiekt.csv
          retention-days: 14
