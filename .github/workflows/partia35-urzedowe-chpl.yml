name: "Partia 35 - pobierz urzedowe polskie ChPL RPL"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia35
  cancel-in-progress: false
jobs:
  official-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF validator
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Search official RPL PDFs and apply verified links only
        run: python scripts/partia35-official-rpl-download.py
      - name: Commit verified original PDFs and SQLite links
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ChPL/RPL/ src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo "No safe new official PDF links. SQLite unchanged."
            exit 0
          fi
          git commit -m 'fix: partia35 oryginalne urzedowe ChPL RPL [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia35-urzedowe-chpl
          path: partia35_raport/
          retention-days: 14
