name: Partia 51 - rozpoznanie trzech PDF
on:
  push:
    branches: [winforms]
    paths: ['.github/workflows/partia51-rozpoznanie.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf==1.26.6'
      - name: Odczytaj 3 nowe PDF bez zmiany SQLite
        run: python scripts/partia51-rozpoznaj-trzy-pdf.py
      - name: Zapisz raport audytu
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/audyt_brakujacych_pdf/partia51_nowe_pdf_rozpoznanie.json
          git commit -m "audit: identify three new PDFs [skip ci]"
          git fetch origin winforms
          git rebase origin/winforms
          git push origin HEAD:winforms
