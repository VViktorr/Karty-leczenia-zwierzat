name: Partia 52b - przenies nieuzywane PDF do archiwum-katalogu
on:
  push:
    branches: [winforms]
    paths: ['.github/workflows/partia52b-archiwizuj.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: partia52b-archive
  cancel-in-progress: false
jobs:
  move-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Zweryfikuj i przenies 91 PDF do osobnej galezi archiwalnej
        run: python scripts/partia52b-przenies-do-archiwum.py
      - name: Commit usuniecia nieuzywanych PDF z winforms i czyszczenie osieroconych documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia52b_przeniesienie_do_archiwum.json
          git diff --cached --check
          git commit -m "chore: move 91 unlinked ChPL PDFs to archiwum-katalogu [skip ci]"
          git fetch origin winforms
          git rebase origin/winforms
          git push origin HEAD:winforms
