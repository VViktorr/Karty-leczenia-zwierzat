name: "Partia 15 - weryfikacja 24 wariantow Oxytocinum i Enrofloksacyna"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: false
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: "Porownaj warianty z ChPL bez modyfikacji SQLite"
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,hashlib,json,re
          from pathlib import Path
          import fitz
          root=Path.cwd()
          dbfile=root/'src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          sha=hashlib.sha256(dbfile.read_bytes()).hexdigest()
          db=sqlite3.connect(f'file:{dbfile}?mode=ro',uri=True)
          db.row_factory=sqlite3.Row
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
          assert db.execute('SELECT COUNT(*) FROM variants').fetchone()[0]==2944
          products=[
            ('16987','RPL_16987_Oxytocinum_Biowet_Puławy_RPL_ChPL.pdf',[*range(2198,2216)]),
            ('17205','RPL_17205_Enrofloksacyna_10_RPL_ChPL.pdf',[450,451,452,1582,1583,1584])
          ]
          dst=root/'partia15_weryfikacja'
          dst.mkdir(exist_ok=True)
          index=['# Partia 15 — weryfikacja 24 wariantów (bez edycji)','',
              'Weryfikacja obecności gatunków, nazw produktów i dróg podania w oryginalnych ChPL.','']
          for rpl,name,ids in products:
            file=root/'data/ChPL/RPL'/name
            assert file.is_file() and file.read_bytes().startswith(b'%PDF-'),f'Brak prawidłowego PDF {rpl}'
            with fitz.open(file) as doc:
              txt='\n\n'.join(p.get_text(sort=True) for p in doc)
              assert len(txt.strip())>200,f'Brak ekstrakcji ChPL {rpl}'
              print(f'RPL {rpl}: {len(doc)} pages, {len(txt)} chars')
            found=[dict(row) for row in db.execute('SELECT * FROM variants WHERE id IN ('+','.join('?'*len(ids))+') ORDER BY id',ids)]
            assert len(found)==len(ids),f'Niepelna grupa {rpl}'
            assert all(str(x['rpl_id'])==rpl for x in found),f'Nieoczekiwany numer RPL {rpl}'
            assert all('archiwal' not in str(x['scope'] or '').casefold() for x in found)
            lines=[f'# RPL {rpl}',f'PDF: {file.relative_to(root)}','',f'Łącznie aktywnych wariantów: {len(found)}','',
                '## Warianty SQLite','']
            for x in found:
              lines+= [f"### ID {x['id']}: {x['name']} | {x['species']}",
                 f"Symbol: {x.get('symbol', '')}; RPL: {x['rpl_id']}; droga: {x['route']}",
                 f"Wskazanie: {x['indication']}",f"Dawka: {x['dose']}",f"Karencja: {x.get('withdrawal', '')}",
                 f"PDF: {x['pdf_path']}",'']
            lines+=['## Pełny tekst urzędowej ChPL','',txt]
            (dst/f'RPL_{rpl}_weryfikacja.txt').write_text('\n'.join(lines),encoding='utf8')
            index+= [f'- RPL {rpl}: {len(found)} wariantów, {len(txt)} znaków odczytanej ChPL']
          index+=['',f'SHA256 niezmienionej SQLite: {sha}']
          (dst/'INDEKS.md').write_text('\n'.join(index)+'\n',encoding='utf8')
          db.close()
          assert hashlib.sha256(dbfile.read_bytes()).hexdigest()==sha
          print('\n'.join(index))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: partia15-porownanie-chpl
          path: partia15_weryfikacja/
          retention-days: 7
