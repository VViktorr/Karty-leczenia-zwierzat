name: Audyt oznaczen do weryfikacji SQLite
on:
  push:
    branches: [winforms]
    paths: [.github/workflows/audit-verification-sqlite.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tylko odczyt bazy
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,json,re,collections
          path='src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          db=sqlite3.connect(f'file:{path}?mode=ro',uri=True)
          db.row_factory=sqlite3.Row
          pats={
            'weryfikac':r'weryfikac|zweryfikow|do sprawdzenia|sprawdzenia|wymaga sprawdzenia',
            'wg ChPL lub ulotki':r'wg\s*chpl|według\s*chpl|zgodnie\s*z\s*chpl|wg\s*ulotk|zgodnie\s*z\s*ulotk',
            'wg RPL lub UPD':r'wg\s*rpl|wg\s*upd|według\s*rpl|według\s*upd',
            'brak / nieustalone':r'nieustalon|do uzupełnienia|brak danych|nie podano w chpl|do potwierdzenia'
          }
          collected={}
          bycategory=collections.defaultdict(set)
          for trow in db.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"):
            table=trow[0]
            columns=[x[1] for x in db.execute(f'PRAGMA table_info("{table}")') if x[2].upper() in ('TEXT','VARCHAR','CLOB') or 'CHAR' in x[2].upper()]
            if not columns: continue
            for row in db.execute(f'SELECT rowid,* FROM "{table}"'):
              d=dict(row)
              for col in columns:
                value=d.get(col)
                if not isinstance(value,str):continue
                for label,pattern in pats.items():
                  if re.search(pattern,value,re.I):
                    key=(table,str(d.get('symbol') or d.get('id') or d.get('rowid')),col)
                    collected.setdefault(key,set()).add(label)
                    bycategory[label].add(key)
          print('AUDIT_BEGIN')
          print('CATEGORIES',json.dumps({p:len(s) for p,s in bycategory.items()},ensure_ascii=False))
          print('TOTAL_MATCHED_CELLS',len(collected))
          print('TABLE_FIELDS',json.dumps(dict(collections.Counter(f'{t}.{col}' for t,_,col in collected)),ensure_ascii=False))
          products={str(x['symbol']):str(x['name']) for x in db.execute('SELECT symbol,name FROM products')}
          sorted_rows=sorted(collected.items(),key=lambda x:(x[0][0],x[0][1],x[0][2]))
          print('MATCHES_BEGIN')
          for (table,key,col),labels in sorted_rows[:350]:
            if table=='variants':
              row=db.execute('SELECT symbol,species FROM variants WHERE id=?',(key,)).fetchone()
              symbol=str(row['symbol']) if row else ''
              title=products.get(symbol,'')
              species=str(row['species']) if row else ''
            elif table=='products':
              symbol=key;title=products.get(symbol,'');species=''
            else: symbol='';title='';species=''
            print(json.dumps({'table':table,'key':key,'symbol':symbol,'name':title,'species':species,'column':col,'categories':sorted(labels)},ensure_ascii=False))
          print('MATCHES_END')
          print('AUDIT_END')
          PY
