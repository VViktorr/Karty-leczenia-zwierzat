name: Sprawdz pilne nieprecyzyjne dawkowania
on:
  push:
    branches: [winforms]
    paths: [.github/workflows/audit-urgent-dose.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Odczyt z SQLite i powiazanych dokumentow
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,json
          from pathlib import Path
          db=sqlite3.connect('file:src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite?mode=ro',uri=True)
          db.row_factory=sqlite3.Row
          ids=(1637,2337,1581,2338,1588,2339,1390,1393,2340,406,510)
          for id in ids:
            r=db.execute("""SELECT v.id,p.name,v.rpl_id,v.species,v.indication,v.route,v.dose,
                       v.pdf_path,v.scope,v.source FROM variants v JOIN products p ON p.symbol=v.symbol WHERE v.id=?""",(id,)).fetchone()
            if not r:print('MISSING',id);continue
            d=dict(r)
            d['pdf_exists']=bool(r['pdf_path'] and Path(r['pdf_path']).is_file())
            print('NEEDS_DOSE',json.dumps(d,ensure_ascii=False))
            if not r['rpl_id']:continue
            peers=db.execute("""SELECT v.id,p.name,v.species,v.indication,v.route,v.dose,v.scope,v.pdf_path FROM variants v
               JOIN products p ON p.symbol=v.symbol WHERE v.rpl_id=? AND v.id<>? ORDER BY v.id LIMIT 60""",(r['rpl_id'],id)).fetchall()
            for x in peers:
              if x['species'].strip().casefold()!=r['species'].strip().casefold():continue
              print('SAME_SPECIES',json.dumps(dict(x),ensure_ascii=False))
          print("Inspection complete")
          PY
