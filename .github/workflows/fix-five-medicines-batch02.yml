name: Korekta 5 lekow - partia 02 (PDF Duphalyte)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-fix-five-batch02
  cancel-in-progress: false
jobs:
  update-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Sprawdz 5 lekow i polacz Duphalyte z oryginalnym PDF RPL
        run: python scripts/fix-five-medicines-batch02.py
      - name: Commit zaktualizowanej SQLite bez kompilacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo 'Baza bez zmian'
            exit 0
          fi
          git commit -m 'fix: Duphalyte 8 PDF RPL links - five medicines batch 02 [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
