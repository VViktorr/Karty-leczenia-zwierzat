name: "Partia 13 - naprawa oryginalnych ChPL RPL 32411 i 22647"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-original-pdf-fix
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Safely retrieve and validate official ChPL PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, sqlite3, urllib.request, fitz, re, json
          root=Path.cwd()
          dbpath=root/'src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          initial=hashlib.sha256(dbpath.read_bytes()).hexdigest()
          db=sqlite3.connect(f'file:{dbpath}?mode=ro', uri=True)
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not db.execute('PRAGMA foreign_key_check').fetchall()
          targets=[
            ('32411','Pneumospectin','RPL_32411_Pneumospectin_RPL_ChPL.pdf',('pneumospectin','linkomycyn','spektynomycyn')),
            ('22647','Rispoval IBR-Marker Vivum','RPL_22647_Rispoval_IBR-Marker_Vivum_liofilizat_i_rozpus_RPL_ChPL.pdf',('rispoval','ibr-marker','vivum'))
          ]
          results=[]
          repaired=[]
          for rpl,name,filename,needles in targets:
              path=root/'data/ChPL/RPL'/filename
              assert path.is_file(), f'Missing original path: {path}'
              old=path.read_bytes()
              assert not old.startswith(b'%PDF-'),f'Existing file is already PDF: {rpl}; stop for manual review'
              url=f'https://rejestrymedyczne.ezdrowie.gov.pl/api/rpl/medicinal-products/{rpl}/characteristic'
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; veterinary-PDF-validation/1.0)','Accept':'application/pdf'})
                  with urllib.request.urlopen(request,timeout=35) as res:
                      candidate=res.read(12_000_001)
                      ctype=res.headers.get('Content-Type','')
                  if len(candidate)>12_000_000:raise ValueError('Downloaded document too large')
                  if not candidate.startswith(b'%PDF-'):raise ValueError(f'Not PDF (content-type={ctype}, bytes={len(candidate)})')
                  with fitz.open(stream=candidate,filetype='pdf') as pdf:
                      if not 2<=len(pdf)<=100:raise ValueError(f'Unexpected page count {len(pdf)}')
                      full=' '.join(page.get_text(sort=True) for page in pdf)
                  text=' '.join(full.lower().split())
                  for needle in needles:
                      if needle not in text:raise ValueError(f'Missing expected product term {needle}')
                  if not ('charakterystyk' in text and ('dawkowanie' in text or 'droga podania' in text)):
                      raise ValueError('Missing ChPL headings')
                  if hashlib.sha256(old).digest()==hashlib.sha256(candidate).digest():
                      raise ValueError('No document change')
                  path.write_bytes(candidate)
                  repaired.append(str(path.relative_to(root)))
                  results.append({'rpl':rpl,'result':'REPAIRED_OFFICIAL_CHPL','pages':len(fitz.open(stream=candidate,filetype='pdf')),'sha256':hashlib.sha256(candidate).hexdigest(),'url':url})
              except Exception as exc:
                  assert path.read_bytes()==old,'Original altered despite failure'
                  results.append({'rpl':rpl,'result':'NOT_REPLACED','reason':str(exc),'url':url})
          assert hashlib.sha256(dbpath.read_bytes()).hexdigest()==initial,'SQLite changed'
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not db.execute('PRAGMA foreign_key_check').fetchall()
          db.close()
          Path('partia13_pdf_result.json').write_text(json.dumps({'results':results,'repaired':repaired,'sqlite_sha256':initial},ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          print('SQLite intact',initial)
          if not repaired:print('No valid official ChPL retrieved — no PDF replaced.')
          PY
      - name: Commit only verified original PDFs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ChPL/RPL/RPL_32411_Pneumospectin_RPL_ChPL.pdf data/ChPL/RPL/RPL_22647_Rispoval_IBR-Marker_Vivum_liofilizat_i_rozpus_RPL_ChPL.pdf
          if git diff --cached --quiet; then
            echo 'No validated replacement to commit'
            exit 0
          fi
          git commit -m 'docs: napraw urzedowe ChPL Pneumospectin Rispoval (tylko potwierdzone) [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia13-pdf-validation
          path: partia13_pdf_result.json
          if-no-files-found: warn
          retention-days: 7
