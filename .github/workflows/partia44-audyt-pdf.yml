name: Partia 44 - audyt PDF (bez kompilacji)
on:
  push:
    branches: [winforms]
    paths:
      - '.github/workflows/partia44-audyt-pdf.yml'
      - 'scripts/partia44-pelny-audyt-pdf.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audyt-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz biezacy winforms
        uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF parser
        run: python -m pip install pymupdf
      - name: Audyt aktualnej SQLite i PDF, bez modyfikacji bazy
        run: python scripts/partia44-pelny-audyt-pdf.py
      - name: Zapisz raporty audytu na winforms
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audyt_brakujacych_pdf/partia44_braki_z_nazwami_subiekta.csv data/audyt_brakujacych_pdf/partia44_pelny_audyt.json data/audyt_brakujacych_pdf/partia44_podsumowanie.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: report actual missing ChPL links after batch43 [skip ci]'
            git push origin HEAD:winforms
          fi
