name: "Partia 11 - tresc ChPL dziesieciu lekow"
run-name: "Partia 11 - urzedowe PDF do weryfikacji dawkowania"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wyciag-chpl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: false
      - name: "Wyciagnij tresc 10 ChPL (bez zmian SQLite)"
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, subprocess, pathlib, re, hashlib, json
          root=pathlib.Path.cwd()
          dbfile=root/'src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          before=hashlib.sha256(dbfile.read_bytes()).hexdigest()
          con=sqlite3.connect(f'file:{dbfile}?mode=ro',uri=True)
          con.row_factory=sqlite3.Row
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not con.execute('PRAGMA foreign_key_check').fetchall()
          ids={'Febrivac Dist':'16827','IBR marker zywy':'28639','Nerfasin':'29972',
             'Nobivac DHPPi':'16737','Nobivac Tricat Trio':'18939','Oxyflex XLA':'16575',
             'Polocainum 5%':'20473','Pyralgivet':'18806','Rispoval 3':'22684',
             'Wellicox':'30613'}
          out=root/'partia11_chpl';out.mkdir(exist_ok=True)
          entries=[]
          for label,rpl in ids.items():
              rows=[dict(r) for r in con.execute('SELECT id,name,species,indication,route,dose,card_text,pdf_path,scope FROM variants WHERE rpl_id=? ORDER BY id',(rpl,)) if 'archiwal' not in str(r['scope'] or '').casefold()]
              assert rows, f'Brak wariantow aktywnych dla {rpl}'
              paths={r['pdf_path'] for r in rows}
              assert len(paths)==1 and None not in paths, f'Niejasne powiazanie PDF: {label}: {paths}'
              rel=pathlib.Path(next(iter(paths)))
              assert not rel.is_absolute() and '..' not in rel.parts
              file=root/rel
              assert file.is_file() and file.read_bytes()[:5]==b'%PDF-',f'Niepoprawny PDF: {file}'
              p=subprocess.run(['pdftotext','-layout',str(file),'-'],capture_output=True,text=True)
              txt=p.stdout
              heading=f'{label} | RPL {rpl} | PDF: {rel} | SHA256: {hashlib.sha256(file.read_bytes()).hexdigest()}'
              if p.returncode or len(txt.strip())<200:
                  entries.append((label,rpl,'BRAK TEKSTU - SKAN LUB NIEPOPRAWNY PDF',len(txt)))
                  (out/f'RPL_{rpl}_wyciag.txt').write_text(heading+'\n\nBRAK CZYTELNEGO TEKSTU; WYMAGA PRZEGLADU OBRAZU PDF.\n',encoding='utf8')
                  continue
              (out/f'RPL_{rpl}_pelny_tekst.txt').write_text(heading+'\n\n'+txt,encoding='utf8')
              cleaned=re.sub(r'[ \t]+',' ',txt)
              sections=[]
              for m in re.finditer(r'dawkowanie|droga podania|schemat szczepie|ponown[eay] szczepi|przypominaj|okres karencji|szczepieni[eau]|dawka maksymalna|obj[eę]to[sś][cć] na miejsce',cleaned,re.I):
                  start=max(0,m.start()-250);end=min(len(cleaned),m.end()+1200)
                  if sections and start<=sections[-1][1]+150:
                      sections[-1]=(sections[-1][0],max(end,sections[-1][1]))
                  else:sections.append((start,end))
              with (out/f'RPL_{rpl}_wyciag.txt').open('w',encoding='utf8') as f:
                  f.write(heading+'\n\nWARIANTY AKTYWNE W SQLITE:\n')
                  for r in rows:
                      f.write(f"ID {r['id']} | {r['species']} | {r['route']} | {r['indication']}\nDAWKA: {r['dose']}\nCARD_TEXT: {r['card_text']}\n\n")
                  f.write('\nFRAGMENTY ChPL (niezalezny przeglad w kontekscie pelnego PDF):\n')
                  for a,b in sections:
                      f.write(f'\n--- [znaki {a}-{b}] ---\n'+cleaned[a:b]+'\n')
              entries.append((label,rpl,'tekst odczytany',len(txt)))
          con.close()
          assert hashlib.sha256(dbfile.read_bytes()).hexdigest()==before, 'Naruszono plik SQLite!'
          lines=['# Partia 11 — ekstrakcja 10 urzedowych ChPL','',
                 'SQLite pozostala bez zmian. Tekst z PDF wymaga zweryfikowania kompletnosci i zgodnosci z wlasciwym gatunkiem oraz droga podania.',
                 '','| Produkt | RPL | Status | Znaki PDF |','|---|---:|---|---:|']
          for n,r,s,chars in entries:lines.append(f'| {n} | {r} | {s} | {chars} |')
          (out/'INDEKS.md').write_text('\n'.join(lines)+'\n',encoding='utf8')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: "partia11-chpl-teksty"
          path: partia11_chpl/
          retention-days: 7
