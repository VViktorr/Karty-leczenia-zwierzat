name: ReactKL frontend and Windows desktop checks
on:
  push:
    branches: [ReactKL]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  react-desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React dependencies
        working-directory: ui/react
        run: npm install --no-audit --no-fund
      - name: Validate expiry lot grouping (no SQL required)
        working-directory: ui/react
        run: npm run test:expiry
      - name: Build React frontend
        working-directory: ui/react
        run: npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build Windows WebView2 host
        run: dotnet build src/KartyLeczenia.ReactKL/KartyLeczenia.ReactKL.csproj -c Release
      - name: Check React assets copied
        shell: pwsh
        run: |
          $asset = Get-ChildItem src/KartyLeczenia.ReactKL/bin/Release -Filter index.html -Recurse |
            Where-Object { $_.FullName -match 'react-ui' } | Select-Object -First 1
          if (!$asset) { throw 'Missing compiled React assets in desktop output.' }
      - name: Ensure React-only Windows host has no legacy AntdUI dependency
        shell: pwsh
        run: |
          if (Get-ChildItem src/KartyLeczenia.ReactKL/bin/Release -Filter AntdUI.dll -Recurse) {
            throw 'ReactKL must not depend on AntdUI.'
          }
          if (Select-String -Path src/KartyLeczenia.ReactKL/*.cs -Pattern 'new MainForm|using AntdUI|openClassic') {
            throw 'Old WinForms view referenced from React-only shell.'
          }
      - name: Registry compatibility
        run: dotnet run --project tests/RegistryChecks -c Release
      - name: Connection settings
        run: dotnet run --project tests/ConnectionChecks -c Release
      - name: ReactKL installation and update regression checks
        run: dotnet run --project tests/ReactKLChecks -c Release
      - name: Publish standalone Windows preview
        run: dotnet publish src/KartyLeczenia.ReactKL/KartyLeczenia.ReactKL.csproj -c Release -r win-x64 --self-contained true -o ReactKL-preview
      - name: Add React preview launcher
        shell: pwsh
        run: |
          Set-Content -Path ReactKL-preview/Uruchom-ReactKL.cmd -Encoding ascii -Value @(
            '@echo off',
            'start "" "%~dp0KartyLeczenia.ReactKL.exe"'
          )
      - name: Check published React frontend
        shell: pwsh
        run: |
          if (!(Test-Path ReactKL-preview/react-ui/index.html)) {
            throw 'Missing React assets in publish folder.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ReactKL-win-x64-preview
          path: ReactKL-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Install Inno Setup for compiler smoke test
        shell: pwsh
        run: |
          $known = @(
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$known) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed.' }
          }
      - name: Validate SQL publication scripts in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($path in @('scripts/Publish-ReactKLUpdate.ps1','installer/Build-ReactKL.ps1','installer/Configure-SharedArchive.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell parse error in $path : $($errors | Out-String)"
            }
          }
      - name: Check new-server-only SQL installer bootstrap contract
        shell: pwsh
        run: |
          $iss = Get-Content -LiteralPath 'installer/KartyLeczenia.ReactKL.iss' -Raw
          $build = Get-Content -LiteralPath 'installer/Build-ReactKL.ps1' -Raw
          if ($iss -notmatch 'not ExistingArchiveConfiguration' -or
              $iss -notmatch "ExtractTemporaryFile\('Setup-SharedArchive\.sql'\)" -or
              $iss -notmatch "ExtractTemporaryFile\('catalog-seed-win-x64\.zip'\)" -or
              $iss -notmatch 'ServerModePage.SelectedValueIndex' -or
              $build -notmatch 'KartyLeczenia.CatalogImport.csproj' -or
              $build -notmatch 'CatalogSeedFile') {
            throw 'ReactKL server installer is missing first-install SQL bootstrap or catalogue seed.'
          }
      - name: Compile in-place Inno Setup script (smoke only; no release/version)
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$iscc) { throw 'ISCC.exe not found.' }
          $payload = (Resolve-Path ReactKL-preview).Path
          $output = Join-Path (Get-Location) 'ReactKL-InnoSmoke'
          # This synthetic ZIP is used ONLY for compilation. Production uses
          # the importer + official ChPL ZIP created by Build-ReactKL.ps1.
          $placeholder = Join-Path $env:RUNNER_TEMP 'catalogue-smoke.txt'
          $seed = Join-Path $env:RUNNER_TEMP 'catalog-seed-win-x64.zip'
          Set-Content -LiteralPath $placeholder -Value 'Compiler smoke only; NOT a server installation package.'
          Compress-Archive -LiteralPath $placeholder -DestinationPath $seed -Force
          & $iscc '/DReleaseVersion=0.0.0' '/DReleaseFileVersion=0.0.0.0' "/DPayloadDir=$payload" "/DCatalogSeedFile=$seed" "/O$output" 'installer/KartyLeczenia.ReactKL.iss'
          if ($LASTEXITCODE -ne 0) { throw 'In-place installer script compilation failed.' }
          if (!(Test-Path (Join-Path $output 'KartyLeczenia-Setup-win-x64-v0.0.0.exe'))) {
            throw 'Inno Setup did not produce the expected smoke-test file.'
          }
