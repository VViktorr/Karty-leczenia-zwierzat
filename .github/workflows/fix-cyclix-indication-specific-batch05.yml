name: Cyclix - 12 schematow wedlug wskazania
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-cyclix-indication-batch05
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Zaktualizuj 12 wariantow Cyclix zgodnie z RPL
        run: python scripts/fix-cyclix-indication-specific-batch05.py
      - name: Zapisz SQLite bez kompilacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo 'Brak zmian w dawkach'
            exit 0
          fi
          git commit -m 'fix: Cyclix 12 indication specific schedules RPL 18835 [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
