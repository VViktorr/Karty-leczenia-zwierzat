name: Partia 49 - przywroc Equilis Prequenza-Te
on:
  push:
    branches: [winforms]
    paths: ['.github/workflows/partia49-equilis.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf==1.26.6'
      - name: Verify Equilis Polish ChPL and reactivate exact variant
        run: python scripts/partia49-equilis-przywroc.py
      - name: Persist SQLite and report without building application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia49_equilis_prequenza_te.json
          git commit -m "data: restore Equilis Prequenza-Te with verified Polish ChPL [skip ci]"
          git fetch origin winforms
          git rebase origin/winforms
          git push origin HEAD:winforms
