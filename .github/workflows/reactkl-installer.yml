name: ReactKL installer (manual version)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Wpisz recznie wersje instalatora, np. 2.2.5 lub 2.2.5-rc.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '11.0.100'
      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: ./installer/Install-ReactKLCompiler.ps1
      - name: Build manual-version in-place SQL KartyLeczenia setup
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./installer/Build-ReactKL.ps1 -Version $env:RELEASE_VERSION -Iscc $env:REACTKL_ISCC
      - name: Verify installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $path = "Instalatory/KartyLeczenia-Setup-win-x64-v$env:RELEASE_VERSION.exe"
          if (!(Test-Path -LiteralPath $path)) { throw "Nie znaleziono $path" }
          Get-FileHash -Path $path -Algorithm SHA256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: KartyLeczenia-Setup-win-x64
          path: Instalatory/KartyLeczenia-Setup-win-x64-v*.exe
          if-no-files-found: error
          retention-days: 14
