name: "Partia 40 - Acticarp i audyt PDF wg nazwy i mocy"
on:
  push:
    branches: [winforms]
    paths:
      - ".github/workflows/partia40-acticarp-audyt.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia40
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Validate original Acticarp ChPL and inventory missing PDF matching by name then strength
        run: python scripts/partia40-acticarp-i-kandydaci.py
      - name: Persist verified catalog relationships and audit without altering clinical data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia40_wynik.json
          git add -f data/audyt_brakujacych_pdf/partia40_kandydaci_pdf_nazwa_moc_subiekt.csv
          if git diff --cached --quiet; then
            echo "No changes to persist"
            exit 0
          fi
          git commit -m 'data: partia40 Acticarp PDF oraz kandydaci do pozostalych lekow [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia40-kandydaci-pdf-subiekt
          path: |
            data/audyt_brakujacych_pdf/partia40_wynik.json
            data/audyt_brakujacych_pdf/partia40_kandydaci_pdf_nazwa_moc_subiekt.csv
          retention-days: 14
