name: "Partia 17 - audyt 10 kolejnych grup PDF ChPL"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: false
      - name: "Instalacja czytnika ChPL"
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: "Wykryj 10 kolejnych grup po nazwie i numerze RPL"
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, pathlib, hashlib, re, json, unicodedata
          import fitz
          root=pathlib.Path.cwd()
          p=root/'src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          before=hashlib.sha256(p.read_bytes()).hexdigest()
          db=sqlite3.connect(f'file:{p}?mode=ro',uri=True)
          db.row_factory=sqlite3.Row
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not db.execute('PRAGMA foreign_key_check').fetchall()
          allrows=[dict(x) for x in db.execute('SELECT id,name,rpl_id,species,pdf_path,scope FROM variants ORDER BY id')]
          assert len(allrows)==2944
          active=[x for x in allrows if 'archiwal' not in str(x['scope'] or '').casefold()]
          pdfroot=root/'data/ChPL/RPL'
          def norm(v):
            s=unicodedata.normalize('NFKD',str(v or '').casefold())
            return re.sub(r'[^a-z0-9]+',' ',''.join(ch for ch in s if not unicodedata.combining(ch))).strip()
          groups={}
          for row in active:
            rpl=str(row['rpl_id'] or '').strip()
            if not re.fullmatch(r'[0-9]{4,12}',rpl):continue
            path=str(row['pdf_path'] or '').strip()
            file=root/path if path else None
            if file and file.is_file() and file.read_bytes().startswith(b'%PDF-'):continue
            groups.setdefault(rpl,[]).append(row)
          candidates=[]
          excluded=[]
          for rpl,rows in sorted(groups.items(),key=lambda kv:(-len(kv[1]),kv[0])):
            match=list(pdfroot.glob('RPL_'+rpl+'_*.pdf'))
            if len(match)!=1:
              excluded.append({'rpl':rpl,'reason':f'PDF files: {len(match)}','n':len(rows)})
              continue
            pdf=match[0]
            if not pdf.read_bytes().startswith(b'%PDF-'):
              excluded.append({'rpl':rpl,'reason':'invalid PDF header','n':len(rows)})
              continue
            try:
              with fitz.open(pdf) as doc:
                if not (2<=len(doc)<=100):raise ValueError('unexpected page count')
                txt=' '.join(page.get_text() for page in doc)
                pages=len(doc)
              t=norm(txt)
              if len(t)<250:raise ValueError('scanned/unextractable PDF text')
              if 'charakterystyk' not in t:raise ValueError('not an extractable ChPL')
            except Exception as exc:
              excluded.append({'rpl':rpl,'reason':str(exc),'n':len(rows)})
              continue
            names=sorted(set(str(x['name'] or '') for x in rows))
            # Use only a grounded matching core: 1st distinct medicine name token (length >= 5).
            # If this token is missing from the actual PDF, require manual assessment.
            tokens=[]
            for name in names:
              parts=[z for z in norm(name).split() if len(z)>=5 and z not in ('roztwor','proszek','zawiesina','iniekcji','wstrzykiwan','kandydaci','candidate','rpl')]
              if not parts:continue
              tokens.append(parts[0])
            if not tokens or not all(re.search(r'\b'+re.escape(token)+r'\b',t) for token in set(tokens)):
              excluded.append({'rpl':rpl,'reason':'no exact medicine-name token match in ChPL','n':len(rows),'name':names[:2]})
              continue
            # Exclude ambiguous product descriptions even where there is a provisional RPL.
            if any(re.search(r'(?i)candidates|kandydac|or [0-9]{4,}| lub [0-9]{4,}',name) for name in names):
              excluded.append({'rpl':rpl,'reason':'ambiguous product label','n':len(rows)})
              continue
            candidates.append({'rpl':rpl,'name':names[0], 'variants':len(rows),'variant_ids':[x['id'] for x in rows],
              'pdf':str(pdf.relative_to(root)), 'pages':pages,'name_tokens':sorted(set(tokens)),
              'species':sorted(set(str(x['species']) for x in rows))})
          selected=candidates[:10]
          out=root/'partia17_raport'
          out.mkdir(exist_ok=True)
          result={'sqlite_sha256':before,'total_variants':len(allrows),'active_variants':len(active),
           'missing_or_invalid_links':sum(1 for x in active if not x['pdf_path'] or not (root/str(x['pdf_path'])).is_file() or not (root/str(x['pdf_path'])).read_bytes().startswith(b'%PDF-')),
           'candidate_groups':len(candidates),'selected_groups':len(selected),
           'selected_variants':sum(x['variants'] for x in selected),'selected':selected,'excluded':excluded[:50]}
          (out/'partia17.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf8')
          lines=['# Partia 17 — kolejnych 10 grup PDF: audyt ChPL','',
                 f"Łącznie wariantów: {len(allrows)}; aktywne: {len(active)}; bez prawidłowego PDF: {result['missing_or_invalid_links']}.",
                 f"Grupy zakwalifikowane po odczycie rzeczywistej ChPL: {len(candidates)}.",
                 f"Wybrane grupy: {len(selected)}, wariantów: {result['selected_variants']}.",
                 '','| RPL | Lek | Warianty | Strony PDF | ID wariantów |','|---|---|---:|---:|---|']
          for x in selected:
            lines.append(f"| {x['rpl']} | {x['name']} | {x['variants']} | {x['pages']} | {', '.join(map(str,x['variant_ids']))} |")
          lines+=['','Kontrola: zgodność RPL i nazwy leku w odczytanej ChPL. To jest audyt bez zmian w SQLite.','SHA256 SQLite: '+before]
          (out/'partia17.md').write_text('\n'.join(lines)+'\n',encoding='utf8')
          print('\n'.join(lines))
          assert hashlib.sha256(p.read_bytes()).hexdigest()==before
          db.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: partia17-kandydaci-po-weryfikacji-chpl
          path: partia17_raport/
          retention-days: 7
