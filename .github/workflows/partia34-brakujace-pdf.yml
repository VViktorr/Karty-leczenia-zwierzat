name: "Partia 34 - brakujace PDF i powiazania wariantow"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia34
  cancel-in-progress: false
jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Validate unlinked medicines and safely attach verified ChPL
        run: python scripts/partia34-missing-documents.py
      - name: Commit only SQLite links
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo "No fully verified links; SQLite unchanged."
            exit 0
          fi
          git commit -m 'fix: partia34 potwierdzone powiazania ChPL [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia34-braki-dokumentow
          path: partia34_raport/
          retention-days: 14
