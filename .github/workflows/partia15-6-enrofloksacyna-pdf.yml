name: "Partia 15 - 6 powiazan ChPL Enrofloksacyna"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: katalog-lekow-partia15
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: "Powiaz PDF dla 6 wariantow, bez zmian klinicznych"
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,hashlib,pathlib
          dbfile=pathlib.Path('src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite')
          expected='4c48b3d99ab03ccaba25a47c047fa19b77ad4a83f0a605a2f14a3e49c057b8d4'
          assert hashlib.sha256(dbfile.read_bytes()).hexdigest()==expected,'Zmieniono SQLite od audytu: przerywam'
          ids=[450,451,452,1582,1583,1584]
          path='data/ChPL/RPL/RPL_17205_Enrofloksacyna_10_RPL_ChPL.pdf'
          pdf=pathlib.Path(path)
          assert pdf.is_file() and pdf.read_bytes().startswith(b'%PDF-')
          db=sqlite3.connect(dbfile)
          db.row_factory=sqlite3.Row
          db.execute('PRAGMA foreign_keys=ON')
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not db.execute('PRAGMA foreign_key_check').fetchall()
          assert db.execute('SELECT count(*) FROM variants').fetchone()[0]==2944
          rows=db.execute('SELECT id,name,species,rpl_id,pdf_path,scope FROM variants WHERE id IN (450,451,452,1582,1583,1584) ORDER BY id').fetchall()
          assert [x['id'] for x in rows]==ids
          assert [x['species'] for x in rows]==['Gołębie','Indyki','Kury','Gołębie','Indyki','Kury']
          for x in rows:
              assert x['name']=='Enrofloksacyna 10% 100 mg/ml' and str(x['rpl_id'])=='17205'
              assert x['pdf_path'] is None or str(x['pdf_path']).strip()==''
              assert 'archiwal' not in str(x['scope'] or '').casefold()
          try:
              db.execute('BEGIN IMMEDIATE')
              db.execute('INSERT OR IGNORE INTO documents(path) VALUES (?)',(path,))
              for vid in ids:
                  change=db.execute('UPDATE variants SET pdf_path=? WHERE id=? AND rpl_id=? AND (pdf_path IS NULL OR TRIM(pdf_path)=\'\')',(path,vid,'17205'))
                  assert change.rowcount==1
              assert db.execute('SELECT count(*) FROM variants').fetchone()[0]==2944
              assert db.execute('SELECT count(*) FROM variants WHERE pdf_path=? AND id IN (450,451,452,1582,1583,1584)',(path,)).fetchone()[0]==6
              assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              assert not db.execute('PRAGMA foreign_key_check').fetchall()
              db.commit()
              print('Podłączono 6 ChPL: ID',ids)
          except:
              db.rollback()
              raise
          finally:
              db.close()
          PY
      - name: "Zapisz tylko SQLite w winforms"
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet && { echo 'Brak zmian'; exit 1; }
          git commit -m 'fix: partia 15 polacz 6 Enrofloksacyna z urzedowa ChPL [skip ci]'
          git push origin HEAD:winforms
