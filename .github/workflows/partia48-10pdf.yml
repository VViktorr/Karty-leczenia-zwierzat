name: Partia 48 - 10 PDF i archiwizacja pozostalych
on:
  push:
    branches: [winforms]
    paths: ['.github/workflows/partia48-10pdf.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-link-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf==1.26.6'
      - name: Zweryfikuj 10 PDF, powiaz zgodne i archiwizuj pozostale bez PDF
        run: python scripts/partia48-10pdf-archiwizuj-reszte.py
      - name: Zapisz SQLite i audyt bez kompilacji programu
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia48_10pdf_archiwizacja_wynik.json
          git commit -m "data: link verified new Polish ChPL PDFs and archive unlinked variants [skip ci]"
          git fetch origin winforms
          git rebase origin/winforms
          git push origin HEAD:winforms
