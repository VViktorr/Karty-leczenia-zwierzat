name: Partia 10 - dokladny stan zaleglosci i 10 lekow
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-active-backlog-batch10
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Policz aktualne aktywne zaleglosci z SQLite i skontroluj PDF
        run: python scripts/audit-active-backlog-batch10.py
      - name: Zapisz aktualny raport bez kompilacji i zmian SQLite
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audyt_aktywnych_zaleglosci_partia_10_2026-11-15.md
          if git diff --cached --quiet; then
            echo 'Brak zmian raportu'
            exit 0
          fi
          git commit -m 'audit: active-only SQLite backlog and ten medicine priority batch10 [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
