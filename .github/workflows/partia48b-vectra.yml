name: Partia 48b - Vectra 3D waga 1-4kg
on:
  push:
    branches: [winforms]
    paths: ['.github/workflows/partia48b-vectra.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf==1.26.6'
      - run: python scripts/partia48b-vectra-waga.py
      - name: Save SQLite and warning report, no app builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia48b_vectra_kategoria_wagowa.json
          git commit -m "data: link Vectra 3D 1-4kg Subiekt with 1.5-4kg SPC warning [skip ci]"
          git fetch origin winforms
          git rebase origin/winforms
          git push origin HEAD:winforms
