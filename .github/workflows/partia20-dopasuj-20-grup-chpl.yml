name: "Partia 20 - 20 kolejnych grup urzedowych ChPL PDF"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia20
  cancel-in-progress: false
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: "Waliduj i zapisz do 20 grup powiazan PDF"
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, sqlite3, unicodedata
          import fitz
          
          root=Path.cwd()
          p=root/"src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite"
          source_hash=hashlib.sha256(p.read_bytes()).hexdigest()
          db=sqlite3.connect(p)
          db.row_factory=sqlite3.Row
          db.execute("PRAGMA foreign_keys=ON")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          assert db.execute("SELECT COUNT(*) FROM variants").fetchone()[0]==2944
          
          def valid_pdf(path):
              return path.is_file() and path.read_bytes()[:5]==b"%PDF-"
          
          def norm(s):
              chars=unicodedata.normalize("NFKD",str(s or "").casefold())
              return re.sub(r"[^a-z0-9]+"," ","".join(c for c in chars if not unicodedata.combining(c))).strip()
          
          def missing(row):
              old=str(row["pdf_path"] or "").strip()
              return not old or not valid_pdf(root/old)
          
          rows=[dict(r) for r in db.execute("SELECT id,name,rpl_id,species,pdf_path,scope FROM variants ORDER BY id")]
          active=[r for r in rows if "archiwal" not in str(r["scope"] or "").casefold()]
          assert len(active)==2902
          before=sum(missing(r) for r in active)
          groups={}
          for row in active:
              if not missing(row):continue
              rpl=str(row["rpl_id"] or "").strip()
              if not re.fullmatch(r"[0-9]{4,12}",rpl):continue
              groups.setdefault(rpl,[]).append(row)
          
          accepted=[]
          rejected=[]
          for rpl,rs in sorted(groups.items(),key=lambda x:(-len(x[1]),x[0])):
              files=list((root/"data/ChPL/RPL").glob("RPL_"+rpl+"_*.pdf"))
              if len(files)!=1:
                  rejected.append((rpl,"no unique PDF"))
                  continue
              file=files[0]
              if not valid_pdf(file):
                  rejected.append((rpl,"bad PDF header"))
                  continue
              try:
                  with fitz.open(file) as doc:
                      assert 2<=len(doc)<=100 and not doc.is_encrypted
                      txt=norm(" ".join(pg.get_text(sort=True) for pg in doc))
                      assert len(txt)>300 and "charakterystyk" in txt
                      pages=len(doc)
              except Exception as ex:
                  rejected.append((rpl,"unreadable PDF "+str(ex)))
                  continue
              names={str(r["name"] or "") for r in rs}
              if any(re.search(r"(?i)candidates|kandydac|(?:or|lub)\s+[0-9]{4,}",n) for n in names):
                  rejected.append((rpl,"ambiguous name"))
                  continue
              tokens=[]
              for name in names:
                  words=[w for w in norm(name).split() if len(w)>=5 and w not in {
                    "roztwor","proszek","zawiesina","iniekcji","wstrzykiwan","kapsulki",
                    "tabletki","tabletke","weterynaryjny","substancja"}]
                  if not words:
                      break
                  tokens.append(words[0])
              if len(tokens)!=len(names) or not all(re.search(r"\b"+re.escape(w)+r"\b",txt) for w in tokens):
                  rejected.append((rpl,"medicine name absent in ChPL"))
                  continue
              # Only attach if no existing correct PDF will be replaced and current RPL is exact.
              expected_ids=sorted(r["id"] for r in rs)
              accepted.append({"rpl":rpl,"name":sorted(names)[0],"ids":expected_ids,
                  "pdf":file.relative_to(root).as_posix(),"pages":pages})
          selected=accepted[:20]
          ids={i for g in selected for i in g["ids"]}
          assert sum(len(g["ids"]) for g in selected)==len(ids)
          assert selected,"No safely matched group found; do not change SQLite"
          
          # Verify every selected row immediately before transaction.
          for group in selected:
              for ident in group["ids"]:
                  x=db.execute("SELECT id,rpl_id,pdf_path,scope FROM variants WHERE id=?",(ident,)).fetchone()
                  assert x and str(x["rpl_id"])==group["rpl"] and "archiwal" not in str(x["scope"] or "").casefold()
                  old=str(x["pdf_path"] or "").strip()
                  assert not old or not valid_pdf(root/old)
          
          try:
              db.execute("BEGIN IMMEDIATE")
              for g in selected:
                  path=g["pdf"]
                  db.execute("INSERT OR IGNORE INTO documents(path) VALUES (?)",(path,))
                  for ident in g["ids"]:
                      old=db.execute("SELECT pdf_path FROM variants WHERE id=?",(ident,)).fetchone()[0]
                      old=str(old or "").strip()
                      assert not old or not valid_pdf(root/old)
                      cur=db.execute("UPDATE variants SET pdf_path=? WHERE id=? AND rpl_id=?",(path,ident,g["rpl"]))
                      assert cur.rowcount==1
              assert db.execute("SELECT COUNT(*) FROM variants").fetchone()[0]==2944
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert not db.execute("PRAGMA foreign_key_check").fetchall()
              for g in selected:
                  for ident in g["ids"]:
                      assert db.execute("SELECT pdf_path FROM variants WHERE id=?",(ident,)).fetchone()[0]==g["pdf"]
              db.commit()
          except:
              db.rollback()
              raise
          finally:
              db.close()
          
          db=sqlite3.connect(f"file:{p}?mode=ro",uri=True)
          db.row_factory=sqlite3.Row
          after=sum(missing(dict(x)) for x in db.execute("SELECT pdf_path,scope FROM variants WHERE scope IS NULL OR lower(scope) NOT LIKE '%archiwal%'"))
          assert after==before-len(ids),(before,after,len(ids))
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          db.close()
          result={"before_missing":before,"after_missing":after,"changed":len(ids),"groups":len(selected),
                  "selected":selected,"sqlite_before_sha256":source_hash,
                  "sqlite_after_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"rejected_groups":len(rejected)}
          Path("partia20_result.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf8")
          print("PARTIA20_RESULT",json.dumps(result,ensure_ascii=False))
          
          PY
      - name: "Commit only SQLite"
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet && { echo 'No database changes'; exit 1; }
          git commit -m 'fix: partia 20 do 20 grup zweryfikowanych ChPL PDF [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia20-raport
          path: partia20_result.json
          if-no-files-found: warn
          retention-days: 7
