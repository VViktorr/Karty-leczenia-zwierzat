name: "Partia 26 - urzedowe ChPL dla 30 brakujacych grup"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia26
  cancel-in-progress: false
jobs:
  official_chpl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: "Pobierz tylko zweryfikowane oryginalne PDF urzedowego RPL"
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict, Counter
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import hashlib, json, re, sqlite3, unicodedata
          import fitz
          
          ROOT=Path.cwd()
          DB=ROOT/"src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite"
          TARGET=ROOT/"data/ChPL/RPL"
          REPORT=Path("partia26_raport")
          REPORT.mkdir(exist_ok=True)
          initial_sha=hashlib.sha256(DB.read_bytes()).hexdigest()
          EXPECTED="eacdcae1499788e5e6b91be8c673add00d88e200f3c1d0530d016805e43183b4"
          assert initial_sha==EXPECTED,"Baza SQLite zmienila sie od partii 25 - anuluj aktualizacje"
          db=sqlite3.connect(DB)
          db.row_factory=sqlite3.Row
          db.execute("PRAGMA foreign_keys=ON")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          assert db.execute("SELECT COUNT(*) FROM variants").fetchone()[0]==2944
          fields=[r[1] for r in db.execute("PRAGMA table_info(variants)") if r[1]!="pdf_path"]
          def signature():
              records=db.execute("SELECT "+",".join('"'+x+'"' for x in fields)+" FROM variants ORDER BY id").fetchall()
              return hashlib.sha256(json.dumps([list(row) for row in records],ensure_ascii=False,default=str).encode()).hexdigest()
          sig_before=signature()
          def norm(s):
              raw=unicodedata.normalize("NFKD",str(s or "").casefold())
              return re.sub(r"[^a-z0-9]+"," ",".join([])+"".join(c if (c.isalnum() and ord(c)<128) else " " for c in raw if not unicodedata.combining(c))).strip()
          def pdf_ok(p):
              return p.is_file() and p.open("rb").read(5)==b"%PDF-"
          def missing(row):
              path=str(row["pdf_path"] or "").strip()
              return not path or not pdf_ok(ROOT/path)
          all_active=[dict(x) for x in db.execute("SELECT id,name,rpl_id,pdf_path,scope FROM variants WHERE scope IS NULL OR lower(scope) NOT LIKE '%archiwal%'")]
          assert len(all_active)==2902
          initial_missing=sum(missing(x) for x in all_active)
          assert 0<initial_missing<=257,f"Unexpected missing count: {initial_missing}"
          groups=defaultdict(list)
          for row in all_active:
              if missing(row):
                  key=str(row["rpl_id"] or "").strip()
                  if re.fullmatch(r"\d{4,12}",key):
                      groups[key].append(row)
          def rank(item):
              rpl, rows=item
              candidates=list(TARGET.glob("RPL_"+rpl+"_*.pdf"))
              status=0 if len(candidates)==1 and not pdf_ok(candidates[0]) else 1
              return (status,-len(rows),rpl)
          selected=sorted(groups.items(),key=rank)[:30]
          stats=Counter()
          results=[]
          new_files=[]
          changed=[]
          def validate(data,rows):
              offset=data.find(b"%PDF-")
              if offset!=0:
                  if offset<1 or offset>262144:raise ValueError("Brak wlasciwego naglowka PDF")
                  prefix=data[:offset].lower()
                  if not (b"<?xml" in prefix or b"<?xpacket" in prefix or b"<x:xmpmeta" in prefix):
                      raise ValueError("Nierozpoznany prefiks dokumentu")
                  data=data[offset:]
              if not data.startswith(b"%PDF-") or b"%%EOF" not in data[-4096:] or len(data)<12000:
                  raise ValueError("Niepelna odpowiedz PDF")
              with fitz.open(stream=data,filetype="pdf") as pdf:
                  if pdf.is_encrypted or not 2<=len(pdf)<=100:raise ValueError("Zaszyfrowany lub nieprawidlowy PDF")
                  pages=len(pdf)
                  content=norm(" ".join(p.get_text(sort=True) for p in pdf))
              if "charakterystyk" not in content or len(content)<350:
                  raise ValueError("Nie potwierdzono tresci urzedowej ChPL")
              stopwords={"roztwor","proszek","zawiesina","tabletki","tabletka","szczepionka","iniekcja","wstrzykiwan","dla"}
              for row in rows:
                  terms=[t for t in norm(row["name"]).split() if len(t)>=4 and t not in stopwords and not t.isdigit()]
                  if not terms:raise ValueError("Brak czytelnej nazwy wariantu")
                  # Require a meaningful, distinctive product word; avoid matching a generic formulation.
                  if len(terms[0])<6:raise ValueError("Nazwa zbyt ogolna do automatycznej weryfikacji")
                  if not re.search(r"\b"+re.escape(terms[0])+r"\b",content):
                      raise ValueError("Niepotwierdzona nazwa: "+row["name"][:90])
              return data,pages
          
          for rpl,rows in selected:
              cand=sorted(TARGET.glob("RPL_"+rpl+"_*.pdf"))
              info={"rpl":rpl,"names":sorted(set(str(x["name"]) for x in rows)),
                    "ids":[x["id"] for x in rows],"status":"","pdf":"","errors":[]}
              if len(cand)>1:
                  info["status"]="multiple_existing_candidates"
              elif cand and pdf_ok(cand[0]):
                  info["status"]="existing_pdf_header_valid_but_unlinked_or_unreadable"
              else:
                  data=None
                  for domain in ("rejestry.ezdrowie.gov.pl","rejestrymedyczne.ezdrowie.gov.pl"):
                      url=f"https://{domain}/api/rpl/medicinal-products/{rpl}/characteristic"
                      try:
                          req=Request(url,headers={"Accept":"application/pdf","User-Agent":"KartyLeczenia-ChPL-Audit/1.0"})
                          with urlopen(req,timeout=12) as response:
                              body=response.read(12*1024*1024+1)
                          if len(body)>12*1024*1024:raise ValueError("PDF ponad 12MB")
                          data,pages=validate(body,rows)
                          info["source"]=url
                          info["pages"]=pages
                          break
                      except Exception as exc:
                          info["errors"].append(domain+": "+type(exc).__name__+" "+str(exc)[:130])
                  if data is not None:
                      if len(cand)==1:
                          dest=cand[0]
                          assert not pdf_ok(dest),"Nie nadpisuj poprawnego pliku PDF"
                      else:
                          dest=TARGET/("RPL_"+rpl+"_Urzedowa_ChPL_partia26.pdf")
                          if dest.exists():
                              info["status"]="destination_exists"
                              results.append(info);stats[info["status"]]+=len(rows)
                              continue
                      rel=dest.relative_to(ROOT).as_posix()
                      info["status"]="downloaded_verified"
                      info["pdf"]=rel
                      info["sha256"]=hashlib.sha256(data).hexdigest()
                      new_files.append((dest,data))
                      changed.append((rpl,rows,rel))
                  else:
                      info["status"]="official_download_unavailable_or_unverified"
              stats[info["status"]]+=len(rows)
              results.append(info)
          
          if changed:
              for dest,data in new_files:
                  assert not pdf_ok(dest),"Plik juz jest poprawny, przerwij"
              try:
                  db.execute("BEGIN IMMEDIATE")
                  for rpl,entries,rel in changed:
                      db.execute("INSERT OR IGNORE INTO documents(path) VALUES (?)",(rel,))
                      for row in entries:
                          old=str(row["pdf_path"] or "").strip()
                          assert not old or not pdf_ok(ROOT/old),"Chron prawidlowe powiazanie PDF"
                          updated=db.execute("UPDATE variants SET pdf_path=? WHERE id=? AND rpl_id=?",(rel,row["id"],rpl))
                          assert updated.rowcount==1
                  assert signature()==sig_before,"Nieoczekiwana zmiana danych klinicznych"
                  assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
                  assert not db.execute("PRAGMA foreign_key_check").fetchall()
                  originals={dest:dest.read_bytes() if dest.exists() else None for dest,_ in new_files}
                  for dest,data in new_files:
                      dest.write_bytes(data)
                  db.commit()
              except:
                  db.rollback()
                  for dest,original in locals().get("originals",{}).items():
                      if original is None:
                          dest.unlink(missing_ok=True)
                      else:
                          dest.write_bytes(original)
                  raise
          assert signature()==sig_before
          after_active=[dict(x) for x in db.execute("SELECT id,name,rpl_id,pdf_path,scope FROM variants WHERE scope IS NULL OR lower(scope) NOT LIKE '%archiwal%'")]
          remaining=sum(missing(x) for x in after_active)
          assert remaining==initial_missing-sum(len(x[1]) for x in changed)
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          report={"before_missing":initial_missing,"after_missing":remaining,
                  "checked_groups":len(selected),"downloaded_pdf":len(changed),
                  "linked_variants":sum(len(x[1]) for x in changed),
                  "sqlite_before_sha256":initial_sha,"sqlite_after_sha256":hashlib.sha256(DB.read_bytes()).hexdigest(),
                  "by_status_variant_count":dict(stats),"results":results}
          (REPORT/"result.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PARTIA26_RESULT",json.dumps(report,ensure_ascii=False))
          db.close()
          PY
      - name: "Commit tylko poprawnych PDF i zmian powiazan w SQLite"
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/ChPL/RPL/
          if git diff --cached --quiet; then
            echo "Nie znaleziono potwierdzonych ChPL do zapisania. Brak zmian."
            exit 0
          fi
          git commit -m 'fix: partia 26 pobranie oficjalnych ChPL i powiazania PDF [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia26-raport-urzedowych-chpl
          path: partia26_raport/
          retention-days: 14
