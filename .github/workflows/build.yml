name: Build Windows application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report build start
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/$env:GH_REPO/statuses/$env:GITHUB_SHA" -f state=pending -f context="ci/windows" -f target_url="https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check registry section extraction
        run: dotnet run --project tests/RegistryChecks
      - name: Check connection settings and password protection
        run: dotnet run --project tests/ConnectionChecks -c Release
      - name: Publish Windows executable
        run: dotnet publish src/KartyLeczenia -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Check application startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$pwd/publish/KartyLeczenia.exe" -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) { throw "Application exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        with:
          name: KartyLeczenia-win-x64
          path: publish/
          if-no-files-found: error
      - name: Report build result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_RESULT: ${{ job.status }}
        run: |
          $state = if ($env:JOB_RESULT -eq 'success') { 'success' } else { 'failure' }
          gh api "repos/$env:GH_REPO/statuses/$env:GITHUB_SHA" -f state="$state" -f context="ci/windows" -f target_url="https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID"
