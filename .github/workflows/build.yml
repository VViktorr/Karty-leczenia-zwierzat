name: Build MAUI Windows application
on:
  push:
    branches: [main, maui-windows]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Report build start
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/$env:GH_REPO/statuses/$env:GITHUB_SHA" -f state=pending -f context="ci/maui-windows" -f target_url="https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Check core and old card compatibility
        run: dotnet run --project tests/RegistryChecks -c Release
      - name: Check connection settings and password protection
        run: dotnet run --project tests/ConnectionChecks -c Release
      - name: Publish MAUI Windows executable
        run: dotnet publish src/KartyLeczenia -f net10.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true --self-contained true -o publish
      - name: Check native MAUI window startup
        shell: pwsh
        run: ./scripts/Smoke-Windows.ps1
      - name: Include instructions and package
        shell: pwsh
        run: |
          Copy-Item README.md publish/INSTRUKCJA.md
          Compress-Archive -Path publish/* -DestinationPath KartyLeczenia-MAUI-win-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 KartyLeczenia-MAUI-win-x64.zip).Hash.ToLowerInvariant()
          "$hash  KartyLeczenia-MAUI-win-x64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KartyLeczenia-MAUI-win-x64
          path: |
            KartyLeczenia-MAUI-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Report build result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_RESULT: ${{ job.status }}
        run: |
          $state = if ($env:JOB_RESULT -eq 'success') { 'success' } else { 'failure' }
          gh api "repos/$env:GH_REPO/statuses/$env:GITHUB_SHA" -f state="$state" -f context="ci/maui-windows" -f target_url="https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID"
