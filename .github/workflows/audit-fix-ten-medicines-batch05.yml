name: Partia 05 - 10 lekow aktywne braki i PDF
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-ten-batch05
  cancel-in-progress: false
jobs:
  audit-and-safe-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Rozdziel archiwalne i aktywne braki dla 10 lekow
        run: python scripts/audit-fix-ten-medicines-batch05.py
      - name: Zapisz raport i ewentualne powiazania PDF bez kompilacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_10_lekow_partia_05_aktywne_SQLite.md
          if git diff --cached --quiet; then
            echo 'Brak zmian w raporcie i SQLite'
            exit 0
          fi
          git commit -m 'audit: 10 medicines batch05 active gaps and official PDF links [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
