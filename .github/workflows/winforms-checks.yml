name: WinForms build and regression checks
on:
  push:
    branches: [winforms]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build WinForms
        run: dotnet build src/KartyLeczenia.WinForms/KartyLeczenia.WinForms.csproj -c Release
      - name: Check card and registry compatibility
        run: dotnet run --project tests/RegistryChecks -c Release
      - name: Check connection settings
        run: dotnet run --project tests/ConnectionChecks -c Release
      - name: Check update publisher and compile installer script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/Publish-KartyLeczeniaUpdate.ps1).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }

          $iscc = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          # Compile the installer definition with small placeholder payloads.
          $null = New-Item -ItemType Directory publish-winforms
          Set-Content publish-winforms/check.txt 'installer compilation check'
          Compress-Archive publish-winforms/check.txt catalog-seed-win-x64.zip
          & $iscc "/O$env:RUNNER_TEMP" installer/KartyLeczenia.WinForms.iss
          if ($LASTEXITCODE -ne 0) { throw 'WinForms installer compilation failed.' }
