name: Partia 52 - audyt nieuzywanych PDF
on:
  push:
    branches: [winforms]
    paths: ['.github/workflows/partia52-audyt-pdf.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit PDF bez zmian SQLite i bez kompilacji
        run: python scripts/partia52-audyt-nieuzywanych-pdf.py
      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/audyt_brakujacych_pdf/partia52_pdf_sprzatanie_plan.json
          git commit -m "audit: inventory unused PDF files [skip ci]"
          git fetch origin winforms
          git rebase origin/winforms
          git push origin HEAD:winforms
