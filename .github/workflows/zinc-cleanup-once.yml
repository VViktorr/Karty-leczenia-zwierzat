name: Etap 6 - uporzadkuj warianty masci cynkowej
on:
  push:
    branches: [winforms]
    paths: [.github/workflows/zinc-cleanup-once.yml]
permissions:
  contents: write
jobs:
  clean:
    if: contains(github.event.head_commit.message, 'run zinc variant cleanup once')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Zachowaj jeden aktywny wariant na gatunek
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          p='src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          db=sqlite3.connect(p)
          db.execute('PRAGMA foreign_keys=ON')
          sym='0611'
          rpl=db.execute('SELECT rpl_id,name FROM products WHERE symbol=?',(sym,)).fetchone()
          assert rpl and rpl[0]=='20317',rpl
          data=db.execute('SELECT id,species,edible_tissues,milk,scope FROM variants WHERE symbol=? ORDER BY id',(sym,)).fetchall()
          assert len(data)==16,('Baza zmienila sie, wymagany ponowny przeglad',data)
          keep={'bydło':2225,'koń':2510,'koza':2511,'owca':2512,'pies':2513,'świnia':2432}
          mapkey=lambda s:s.strip().casefold()
          assert {mapkey(r[1]) for r in data}==set(keep),data
          for r in data:
              if r[0] not in keep.values():
                  assert not r[4] or 'Archiwalne' in r[4],r
              else:
                  assert mapkey(r[1]) in keep and keep[mapkey(r[1])]==r[0],r
          byid={r[0]:r for r in data}
          assert byid[2510][2]=='0 dni' and byid[2511][2]=='0 dni' and byid[2512][2]=='0 dni'
          assert byid[2432][2]=='Okres karencji nie obowiązuje'
          assert byid[2513][2]=='Nie dotyczy' and byid[2513][3]=='Nie dotyczy'
          archived=[]
          with db:
              for row in data:
                  id,species,*_=row
                  if id in keep.values():continue
                  db.execute('UPDATE variants SET scope=? WHERE id=?',('Archiwalne — scalony duplikat gatunku; dane historyczne zachowane',id))
                  archived.append(id)
              # Nie modyfikuj niepewnych pełnych karencji, nie zmieniaj dawkowania.
              db.execute('UPDATE variants SET withdrawal_short=? WHERE id=?',('Nie dotyczy',2513))
              db.execute('INSERT OR REPLACE INTO price_withdrawal_entries(id,compact_text) VALUES (?,?)',(2513,'Nie dotyczy'))
          active=db.execute("SELECT id,species FROM variants WHERE symbol=? AND COALESCE(scope,'') NOT LIKE '%Archiwalne%' ORDER BY id",(sym,)).fetchall()
          assert len(active)==6 and {mapkey(x[1]) for x in active}==set(keep),active
          assert len(archived)==10
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
          print('ZINC_ACTIVE',active)
          print('ZINC_ARCHIVED',archived)
          print('SQLITE_OK')
          db.close()
          PY
      - name: Commit do winforms
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet && exit 0
          git commit -m 'fix: masć cynkowa - bez duplikatow gatunkow [skip ci]'
          git push origin HEAD:winforms
