name: Dołącz PDF EPRECIS 20 mg/ml do SQLite
on:
  push:
    branches: [winforms]
    paths:
      - '.github/workflows/attach-eprecis-pdf.yml'
permissions:
  contents: write
jobs:
  attach-pdf:
    if: contains(github.event.head_commit.message, 'attach EPRECIS PDF to SQLite')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Pakiet do utworzenia informacyjnego PDF
        run: python -m pip install --disable-pip-version-check reportlab==4.2.5
      - name: Utwórz PDF i przypisz go do trzech wariantów
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.colors import HexColor
          dbpath=Path("src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite")
          pdfpath=Path("data/ChPL/RPL/EPRECIS_20mg_ml_wyciag_danych_ChPL.pdf")
          pdfpath.parent.mkdir(parents=True,exist_ok=True)
          source="https://rejestrymedyczne.ezdrowie.gov.pl/api/rpl/medicinal-products/35888/characteristic"
          c=canvas.Canvas(str(pdfpath),pagesize=A4)
          w,h=A4
          c.setTitle("EPRECIS 20 mg/ml - wyciag danych z ChPL (nie oryginal)")
          c.setFillColor(HexColor("#15354b"))
          c.rect(0,h-108,w,108,stroke=0,fill=1)
          c.setFillColorRGB(1,1,1)
          c.setFont("Helvetica-Bold",19)
          c.drawString(44,h-57,"EPRECIS 20 mg/ml - 100 ml")
          c.setFont("Helvetica",11)
          c.drawString(44,h-82,"Informacyjny wyciag z ChPL - RPL 35888")
          c.setFillColor(HexColor("#222222"))
          y=h-144
          def line(a,b):
              global y
              c.setFont("Helvetica-Bold",10);c.drawString(44,y,a)
              c.setFont("Helvetica",10);c.drawString(165,y,b)
              y-=28
          line("Postac:", "Roztwor do wstrzykiwan")
          line("Substancja:", "Eprynomektyna 20 mg/ml")
          line("Pozwolenie:", "2502 (PL), RPL 35888")
          line("Droga podania:", "Podskornie (s.c.)")
          line("Dawkowanie:", "Jednorazowo 0,2 mg/kg m.c. = 0,1 ml/10 kg m.c.")
          y-=20
          c.setFont("Helvetica-Bold",13);c.drawString(44,y,"Okresy karencji")
          y-=30
          for sp,tissue in [("Bydlo","63 dni"),("Owce","42 dni"),("Kozy","42 dni")]:
              c.setFillColor(HexColor("#eff4f8"));c.rect(44,y-7,w-88,25,fill=1,stroke=0)
              c.setFillColor(HexColor("#222222"))
              c.setFont("Helvetica-Bold",10);c.drawString(54,y,sp)
              c.setFont("Helvetica",10);c.drawString(225,y,"Tkanki: "+tissue)
              c.drawString(377,y,"Mleko: 0 godzin")
              y-=36
          y-=18
          c.setFont("Helvetica-Bold",12);c.drawString(44,y,"Ograniczenia")
          y-=25
          for s in [
              "Kozy: nie przekraczac 0,6 ml w jednym miejscu podania.",
              "Fiolka 100 ml: nie przekraczac 30 wkluc.",
              "W razie potrzeby stosowac igle do odciagania.",
              "Stosowanie w ciazy owiec i koz: ocena korzysci i ryzyka."
          ]:
              c.setFont("Helvetica",10);c.drawString(44,y,s);y-=22
          y-=20
          c.setFont("Helvetica-Bold",11);c.drawString(44,y,"Oficjalna ChPL (pelny dokument):")
          y-=22
          c.setFont("Helvetica",8);c.setFillColor(HexColor("#2451a2"));c.drawString(44,y,source)
          c.linkURL(source,(44,y-4,w-44,y+12),relative=0)
          y-=44
          c.setFillColor(HexColor("#444444"));c.setFont("Helvetica",9)
          c.drawString(44,y,"Pomocniczy wyciag danych, nie zastępuje pelnej oficjalnej ChPL.")
          c.drawString(44,y-17,"Dane: 15 listopada 2026. Przed uzyciem sprawdz aktualna ChPL.")
          c.showPage();c.save()
          with pdfpath.open("rb") as f: assert f.read(5)==b"%PDF-"
          conn=sqlite3.connect(dbpath)
          conn.execute("PRAGMA foreign_keys=ON")
          sym="000000000000002061"
          rows=conn.execute("SELECT id,species,rpl_id FROM variants WHERE symbol=?",(sym,)).fetchall()
          assert len(rows)==3 and {(s,r) for _,s,r in rows}=={("Bydło","35888"),("Owce","35888"),("Kozy","35888")},rows
          with conn:
              conn.execute("INSERT OR IGNORE INTO documents(path) VALUES (?)",(pdfpath.as_posix(),))
              conn.execute("UPDATE variants SET pdf_path=? WHERE symbol=?",(pdfpath.as_posix(),sym))
          assert conn.execute("SELECT COUNT(*) FROM variants WHERE symbol=? AND pdf_path=?",(sym,pdfpath.as_posix())).fetchone()[0]==3
          assert conn.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not conn.execute("PRAGMA foreign_key_check").fetchall()
          conn.close()
          print("PDF istnieje, 3 warianty podpięte, SQLite integralna")
          PY
      - name: Zapisz PDF i SQLite na winforms
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ChPL/RPL/EPRECIS_20mg_ml_wyciag_danych_ChPL.pdf src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet && exit 0
          git commit -m 'docs: PDF EPRECIS 20 mg/ml i powiazanie z wariantami SQLite [skip ci]'
          git push origin HEAD:winforms
