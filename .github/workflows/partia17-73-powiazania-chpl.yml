name: "Partia 17 - powiaz 73 warianty z 10 urzedowymi ChPL"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sqlite-partia17-pdf
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: "Instaluj czytnik PDF"
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: "Weryfikuj PDF i uzupelnij tylko pdf_path"
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,sqlite3,hashlib,re,unicodedata,json
          import fitz
          dbpath=pathlib.Path('src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite')
          expected='6247129a276ab55f3d13f903b3cb9fdbc31adced266b906063a82e73719070ed'
          assert hashlib.sha256(dbpath.read_bytes()).hexdigest()==expected,'SQLite zmieniona od audytu partii 17; nie modyfikuj'
          groups=json.loads("[[\"16608\",[684,685,732,733,983,984,1658,1659]],[\"16730\",[87,88,507,508,1874,1875,1876,1877]],[\"17027\",[734,735,752,753,754,755,1643,1644]],[\"18423\",[1908,1909,1910,2054,2055,2056,2445,2446]],[\"20356\",[52,53,54,55,56,57,58,59]],[\"23838\",[232,233,234,235,868,869,870,871]],[\"38257\",[1050,1051,1052,1053,1054,1055,1056]],[\"16594\",[647,648,649,650,1437,1438]],[\"16962\",[630,631,632,1896,1897,1898]],[\"16970\",[1432,1464,1502,1525,1534,1671]]]")
          assert len(groups)==10 and sum(len(ids) for _,ids in groups)==73
          def norm(v):
              t=unicodedata.normalize('NFKD',str(v or '').casefold())
              return re.sub(r'[^a-z0-9]+',' ',''.join(ch for ch in t if not unicodedata.combining(ch))).strip()
          con=sqlite3.connect(dbpath)
          con.row_factory=sqlite3.Row
          con.execute('PRAGMA foreign_keys=ON')
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not con.execute('PRAGMA foreign_key_check').fetchall()
          assert con.execute('SELECT COUNT(*) FROM variants').fetchone()[0]==2944
          expected_ids=set()
          changes=[]
          for rpl,ids in groups:
              assert not (expected_ids & set(ids)),f'Duplicate IDs: {rpl}'
              expected_ids.update(ids)
              files=list(pathlib.Path('data/ChPL/RPL').glob('RPL_'+rpl+'_*.pdf'))
              assert len(files)==1,f'Nie ma jednoznacznej urzedowej ChPL RPL {rpl}'
              file=files[0]
              assert file.read_bytes().startswith(b'%PDF-'),f'Niepoprawny PDF RPL {rpl}'
              with fitz.open(file) as doc:
                  assert 2<=len(doc)<=100 and not doc.is_encrypted
                  text=norm(' '.join(page.get_text() for page in doc))
              assert 'charakterystyk' in text and len(text)>250
              rows=[dict(r) for r in con.execute('SELECT id,rpl_id,name,species,scope,pdf_path FROM variants WHERE id IN ('+','.join('?'*len(ids))+') ORDER BY id',ids)]
              assert [x['id'] for x in rows]==sorted(ids),f'ID niezgodne z audytem RPL {rpl}'
              for row in rows:
                  assert str(row['rpl_id'])==rpl,f'Niezgodny RPL ID {row["id"]}'
                  assert 'archiwal' not in str(row['scope'] or '').casefold()
                  label=norm(row['name'])
                  tokens=[s for s in label.split() if len(s)>=5 and s not in ('roztwor','proszek','zawiesina','iniekcji','wstrzykiwan','kandydaci','candidate','rpl')]
                  assert tokens and re.search(r'\b'+re.escape(tokens[0])+r'\b',text),f'Nazwa nie zgadza sie z PDF ID {row["id"]}'
                  old=str(row['pdf_path'] or '').strip()
                  if old:
                      oldfile=pathlib.Path(old)
                      assert not (oldfile.is_file() and oldfile.read_bytes().startswith(b'%PDF-')),f'Zachowaj juz poprawny PDF ID {row["id"]}'
                  changes.append((row['id'],rpl,str(file.as_posix()),old))
          assert len(changes)==73 and len(expected_ids)==73
          print('DO_PODLACZENIA',len(changes),'ID',[x[0] for x in changes])
          try:
              con.execute('BEGIN IMMEDIATE')
              for rpl,ids in groups:
                  path=next(y[2] for y in changes if y[1]==rpl)
                  con.execute('INSERT OR IGNORE INTO documents(path) VALUES (?)',(path,))
              for ident,rpl,path,old in changes:
                  row=con.execute('SELECT pdf_path FROM variants WHERE id=? AND rpl_id=?',(ident,rpl)).fetchone()
                  assert row is not None and str(row['pdf_path'] or '').strip()==old
                  cur=con.execute('UPDATE variants SET pdf_path=? WHERE id=? AND rpl_id=?',(path,ident,rpl))
                  assert cur.rowcount==1,ident
              assert con.execute('SELECT COUNT(*) FROM variants').fetchone()[0]==2944
              assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              assert not con.execute('PRAGMA foreign_key_check').fetchall()
              for ident,rpl,path,old in changes:
                  assert con.execute('SELECT pdf_path FROM variants WHERE id=?',(ident,)).fetchone()[0]==path
              con.commit()
              print('ZAKONCZONO 73 powiazania ChPL PDF dla 10 produktow. Inne kolumny bez zmian.')
          except:
              con.rollback()
              raise
          finally:
              con.close()
          PY
      - name: "Zapisz tylko baze SQLite"
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet && { echo 'Brak zmian w SQLite'; exit 1; }
          git commit -m 'fix: partia 17 powiaz 73 warianty z 10 oficjalnymi ChPL [skip ci]'
          git push origin HEAD:winforms
