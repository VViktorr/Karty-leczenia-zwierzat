name: "Partia 37 - powiaz przeslane PDF ChPL, Bravecto i Contacera"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia37
  cancel-in-progress: false
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF validation library
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Check original uploaded PDF content and safely attach variants
        run: python scripts/partia37-attach-uploaded-pdfs.py
      - name: Commit verified SQLite relationships and audit
        shell: bash
        run: |
          mkdir -p data/audyt_brakujacych_pdf
          cp partia37_raport/result.json data/audyt_brakujacych_pdf/partia37_wynik.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audyt_brakujacych_pdf/partia37_wynik.json src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m 'data: partia37 powiazania przeslanych ChPL bez zmian danych klinicznych [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia37-raport-dokumentow
          path: partia37_raport/
          retention-days: 14
