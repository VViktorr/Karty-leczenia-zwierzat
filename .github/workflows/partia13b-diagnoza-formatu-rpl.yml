name: "Partia 13b - diagnostyka formatu PDF RPL"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: false
      - name: "Inspect raw RPL response and safe decoding candidates"
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, pathlib, hashlib, base64, json, re, zlib
          base=pathlib.Path('data/ChPL/RPL')
          candidates=[
             ('32411','RPL_32411_Pneumospectin_RPL_ChPL.pdf'),
             ('22647','RPL_22647_Rispoval_IBR-Marker_Vivum_liofilizat_i_rozpus_RPL_ChPL.pdf')]
          for rpl,name in candidates:
              p=base/name
              old=p.read_bytes()
              url=f'https://rejestrymedyczne.ezdrowie.gov.pl/api/rpl/medicinal-products/{rpl}/characteristic'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/pdf'})
              with urllib.request.urlopen(req,timeout=40) as response:
                  data=response.read(12000000)
                  ctype=response.headers.get('Content-Type','')
                  encoding=response.headers.get('Content-Encoding','')
              print('===',rpl,'===')
              print('status: length',len(data),'content-type',ctype,'content-encoding',encoding)
              print('original length',len(old),'sha256 same',hashlib.sha256(old).digest()==hashlib.sha256(data).digest())
              print('prefix hex',data[:48].hex(),'prefix printable',repr(data[:120]))
              print('pdf offset',data.find(b'%PDF-'),'pdf at beginning',data.startswith(b'%PDF-'))
              clean=data.strip()
              checks=[('raw',data)]
              try:checks.append(('base64',base64.b64decode(clean,validate=True)))
              except Exception as e:print('base64 not applicable',type(e).__name__)
              try:checks.append(('gzip/zlib',zlib.decompress(data,16+zlib.MAX_WBITS)))
              except Exception:pass
              try:
                  obj=json.loads(data)
                  if isinstance(obj,str):
                      try:checks.append(('json-string-base64',base64.b64decode(obj,validate=True)))
                      except Exception:pass
                  elif isinstance(obj,dict):
                      print('json keys',sorted(obj)[:10])
                      for k in ('content','data','file','base64','document'):
                          val=obj.get(k)
                          if isinstance(val,str):
                              try:checks.append((f'json-{k}-base64',base64.b64decode(val,validate=True)))
                              except Exception:pass
              except Exception:pass
              for kind,blob in checks:
                  print('candidate',kind,'length',len(blob),'prefix',blob[:12].hex(),'is_pdf',blob.startswith(b'%PDF-'))
          print('Only diagnostics: no files changed.')
          PY
