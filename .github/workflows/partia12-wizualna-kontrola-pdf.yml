name: "Partia 12 - skany ChPL i diagnostyka PDF"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: false
      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Render and inspect source PDFs without changing catalog
        shell: bash
        run: |
          python - <<'PY'
          import fitz, pathlib, hashlib, json, sqlite3
          root=pathlib.Path.cwd()
          dbfile=root/'src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          original=hashlib.sha256(dbfile.read_bytes()).hexdigest()
          db=sqlite3.connect(f'file:{dbfile}?mode=ro',uri=True)
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not db.execute('PRAGMA foreign_key_check').fetchall()
          ids=['16827','16575','20473','32411','22647']
          out=root/'partia12_pdf_wyniki'
          out.mkdir(exist_ok=True)
          lines=['# Partia 12 — wizualna kontrola oryginalnych PDF', '',
                 'Bez modyfikacji SQLite i oryginalnych PDF. Render do weryfikacji dokumentów skanowanych.', '',
                 '| RPL | Dokument | Rozmiar (bajtów) | Strony | Znaki tekstu | Wynik |',
                 '|---|---|---:|---:|---:|---|']
          for rpl in ids:
              matches=sorted((root/'data/ChPL/RPL').glob(f'RPL_{rpl}_*.pdf'))
              if len(matches)!=1:
                  lines.append(f'| {rpl} | {len(matches)} plików | — | — | — | Niepewne dopasowanie |')
                  continue
              path=matches[0]
              target=out/rpl
              target.mkdir(exist_ok=True)
              data=path.read_bytes()
              if not data.startswith(b'%PDF-'):
                  lines.append(f'| {rpl} | {path.name} | {len(data)} | — | — | NIEPRAWIDŁOWY NAGŁÓWEK, bez podmiany |')
                  (target/'informacja.txt').write_text('Niepoprawny naglowek PDF. SHA256: '+hashlib.sha256(data).hexdigest(),encoding='utf8')
                  continue
              try:
                  with fitz.open(path) as doc:
                      full='\n\n'.join(page.get_text(sort=True) for page in doc)
                      count=len(doc)
                      for i,page in enumerate(doc):
                          if i>=24: break
                          pix=page.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
                          pix.save(str(target/f'strona_{i+1:02d}.png'))
                      (target/'tekst.txt').write_text(full if len(full.strip())>100 else 'SKAN: brak wyodrebnionego tekstu',encoding='utf8')
                      (target/'informacja.txt').write_text(f'{path.as_posix()}\nSHA256: {hashlib.sha256(data).hexdigest()}\nStrony: {count}\nZnaki: {len(full)}\n',encoding='utf8')
                      lines.append(f'| {rpl} | {path.name} | {len(data)} | {count} | {len(full)} | render OK, treść do kontroli |')
              except Exception as e:
                  lines.append(f'| {rpl} | {path.name} | {len(data)} | — | — | błąd parsowania: {type(e).__name__} |')
                  (target/'informacja.txt').write_text(repr(e),encoding='utf8')
          db.close()
          assert hashlib.sha256(dbfile.read_bytes()).hexdigest()==original,'Zmieniono SQLite!'
          lines+=['','SHA256 SQLite bez zmian: `'+original+'`','',
                  'Weryfikacja wizualna jest konieczna przed korektami klinicznymi. Pliki obrazu PNG mogą zawierać pełną treść urzędowego ChPL.']
          (out/'INDEKS.md').write_text('\n'.join(lines)+'\n',encoding='utf8')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: partia12-pdf-skan-obrazy
          path: partia12_pdf_wyniki/
          retention-days: 7
