name: Partia 06 - Cyclix Fertigest wg ChPL
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-cyclix-fertigest-batch06
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Warunkowe korekty 6 wariantow Cyclix i Fertigest
        run: python scripts/fix-cyclix-fertigest-batch06.py
      - name: Zapis SQLite i raportu bez kompilacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_korekta_Cyclix_Fertigest_partia_06.md
          if git diff --cached --quiet; then
            echo 'Brak zmian'
            exit 0
          fi
          git commit -m 'fix: Cyclix and Fertigest ChPL dosing six variants [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
