name: Cyclix RPL 18835 - aktualna karencja z ChPL
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-cyclix-rpl18835
  cancel-in-progress: false
jobs:
  update-cyclix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Korekta karencji Cyclix i weryfikacja SQLite
        run: python scripts/fix-cyclix-withdrawal-rpl18835.py --apply
      - name: Commit i push tylko bazy SQLite bez kompilacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo 'Brak nowych zmian w SQLite'
            exit 0
          fi
          git commit -m 'fix: Cyclix RPL 18835 tkanki 1 dzien mleko 0 h [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
