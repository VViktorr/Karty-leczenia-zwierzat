name: "Partia 11 - 10 zweryfikowanych wariantow ChPL"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia11
  cancel-in-progress: false
jobs:
  popraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: "Dokladna korekta 10 wariantow; bez kompilacji"
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, pathlib, hashlib, json
          path=pathlib.Path("src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite")
          assert path.exists()
          assert hashlib.sha256(path.read_bytes()).hexdigest()=="170325b1c3b1ae48790932201357460fdddf50099d9d075f8d6f9fc2aa2ae3e5", "SQLite zmieniona od audytu — wymagany nowy przegląd"
          edits=json.loads("[[249,\"28639\",\"2 ml po rekonstytucji donosowo (cielęta 2 tyg.–3 mies.) lub domięśniowo (od 3. mies. życia); przypomnienie co 6–12 mies. wg ChPL.\",\"Donosowo: 2 ml po rekonstytucji (1 ml do każdego nozdrza). Pierwsze szczepienie w wieku 2 tyg.–poniżej 3 mies.; drugą dawkę podać w wieku 3–4 mies. Pierwsze szczepienie przypominające 6 mies. od pierwszego szczepienia; kolejne w odstępach nie dłuższych niż 12 mies. Zgodnie z ChPL RPL 28639.\"],[250,\"28639\",\"2 ml po rekonstytucji donosowo (cielęta 2 tyg.–3 mies.) lub domięśniowo (od 3. mies. życia); przypomnienie co 6–12 mies. wg ChPL.\",\"Domięśniowo: 2 ml po rekonstytucji, jedna dawka szczepienia podstawowego od ukończenia 3 mies. życia (w tym wieku dopuszczalne jest też podanie donosowe). Pierwsze szczepienie przypominające po 6 mies. od pierwszego szczepienia; kolejne nie rzadziej niż co 12 mies. Po wcześniejszym szczepieniu przed 3. mies. życia zastosować dodatkową dawkę w wieku 3–4 mies. zgodnie z ChPL RPL 28639.\"],[260,\"22684\",\"4 ml/zwierzę; szczepienie podstawowe od 12. tyg. życia, 2 dawki w odstępie 3–4 tyg.; odporność wg ChPL\",\"Domięśniowo 4 ml po rekonstytucji. Szczepienie podstawowe od 12. tyg. życia: 2 dawki po 4 ml w odstępie 3–4 tyg. Jeśli wymagana ochrona przeciw BRSV i BVDV typu 1, szczepienie przypominające po 6 mies.; czas trwania odporności przeciw PI3 jest nieznany (ChPL RPL 22684).\"],[1615,\"22684\",\"4 ml/zwierzę; szczepienie podstawowe od 12. tyg. życia, 2 dawki w odstępie 3–4 tyg.; odporność wg ChPL\",\"Domięśniowo 4 ml po rekonstytucji. Szczepienie podstawowe od 12. tyg. życia: 2 dawki po 4 ml w odstępie 3–4 tyg. Jeśli wymagana ochrona przeciw BRSV i BVDV typu 1, szczepienie przypominające po 6 mies.; czas trwania odporności przeciw PI3 jest nieznany (ChPL RPL 22684).\"],[1616,\"22684\",\"4 ml/zwierzę; szczepienie podstawowe od 12. tyg. życia, 2 dawki w odstępie 3–4 tyg.; odporność wg ChPL\",\"Domięśniowo 4 ml po rekonstytucji. Szczepienie podstawowe od 12. tyg. życia: 2 dawki po 4 ml w odstępie 3–4 tyg. Jeśli wymagana ochrona przeciw BRSV i BVDV typu 1, szczepienie przypominające po 6 mies.; czas trwania odporności przeciw PI3 jest nieznany (ChPL RPL 22684).\"],[1617,\"22684\",\"4 ml/zwierzę; szczepienie podstawowe od 12. tyg. życia, 2 dawki w odstępie 3–4 tyg.; odporność wg ChPL\",\"Domięśniowo 4 ml po rekonstytucji. Szczepienie podstawowe od 12. tyg. życia: 2 dawki po 4 ml w odstępie 3–4 tyg. Jeśli wymagana ochrona przeciw BRSV i BVDV typu 1, szczepienie przypominające po 6 mies.; czas trwania odporności przeciw PI3 jest nieznany (ChPL RPL 22684).\"],[2178,\"30613\",\"Dożylnie. Zwykle 1,1 mg/kg m.c. raz dziennie do 5 dni; przy kolce powtórzyć 1–2 razy w razie nawrotu; schemat endotoksemii wg ChPL.\",\"Dożylnie. Ból i zapalenie mięśniowo-szkieletowe lub gorączka: 1,1 mg fluniksyny/kg m.c. (1 ml/45 kg) raz dziennie maks. 5 dni. Kolka: 1,1 mg/kg; w razie nawrotu można powtórzyć 1–2 razy. Endotoksemia: 0,25 mg/kg co 6–8 godz. albo 1,1 mg/kg raz dziennie, maks. 5 dni (ChPL RPL 30613).\"],[2179,\"30613\",\"Domięśniowo: 2,2 mg/kg m.c. (2 ml/45 kg) raz dziennie maks. 3 dni; maks. 4 ml na miejsce. Prosięta: pojedyncze podanie przed zabiegiem wg ChPL.\",\"Domięśniowo. Świnie: 2,2 mg fluniksyny/kg m.c. (2 ml/45 kg) raz dziennie maks. 3 dni, do 4 ml na miejsce wstrzyknięcia. Prosięta ssące: jednorazowo 2,2 mg/kg (0,2 ml/4,5 kg) 15–30 min przed kastracją lub obcięciem ogonów, zgodnie z ChPL RPL 30613.\"],[2586,\"16737\",\"1 ml po rekonstytucji; szczepienie zasadnicze od 8.–9. tyg. życia, powtórzyć po 3–4 tyg. (w wieku 12 tyg.); dawka przypominająca co 1–3 lata wg ChPL.\",\"Podskórnie 1 ml po rekonstytucji. Szczenięta od 8–9 tyg.: dawka pierwsza, druga w wieku 12 tyg.; psy po ukończeniu 12 tyg.: jedna dawka podstawowa. Przy wczesnej ekspozycji stosować odrębny schemat 4–6, 8–9 i 12 tyg. zgodnie z ChPL. Przypominająco: CDV/CAV/CPV co 3 lata, parainfluenza corocznie (RPL 16737).\"],[2587,\"18939\",\"1 ml po rekonstytucji; pierwsza dawka w wieku 8–9 tyg., druga po 3–4 tyg. (w wieku 12 tyg.); przypomnienie co 1–3 lata wg ChPL.\",\"Podskórnie 1 ml po rekonstytucji. Szczepienie podstawowe: 2 dawki w odstępie 3–4 tyg., pierwsza od 8–9 tyg., druga w wieku 12 tyg. Przypominająco: przeciw kaliciwirusowi i herpeswirusowi kotów co rok, przeciw panleukopenii można co 3 lata (RPL 18939; zgodnie z ChPL dla właściwych szczepów).\"]]")
          db=sqlite3.connect(path)
          db.row_factory=sqlite3.Row
          db.execute("PRAGMA foreign_keys=ON")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          assert db.execute("SELECT count(*) FROM variants").fetchone()[0]==2944
          db.execute("BEGIN IMMEDIATE")
          changed=[]
          for vid,rpl,old,new in edits:
              row=db.execute("SELECT id,rpl_id,species,route,scope,dose,card_text FROM variants WHERE id=?",(vid,)).fetchone()
              assert row and str(row['rpl_id'])==rpl, f'RPL mismatch ID {vid}'
              assert 'archiwal' not in str(row['scope'] or '').casefold(), f'archiwalny ID {vid}'
              assert row['dose']==old, f'zmieniono dawkę ID {vid}'
              assert row['card_text'] and row['card_text'].count(old)==1, f'niejednoznaczny card_text {vid}'
              newcard=row['card_text'].replace(old,new,1)
              cur=db.execute("UPDATE variants SET dose=?,card_text=?,verified_at=? WHERE id=? AND rpl_id=? AND dose=?",(new,newcard,"2026-11-15",vid,rpl,old))
              assert cur.rowcount==1
              changed.append(vid)
          assert len(changed)==10
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          assert db.execute("SELECT COUNT(*) FROM variants").fetchone()[0]==2944
          db.commit()
          db.close()
          print('Zaktualizowane ID:',changed)
          print('Bez zmian: karencje, droga podania, wskazania, RPL, pdf_path, pozostałe kolumny')

          PY
      - name: "Commit SQLite i weryfikacja"
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet && { echo 'Brak zmian'; exit 1; }
          git commit -m 'fix: partia 11 — 10 wariantow dawkowania zgodnie z ChPL [skip ci]'
          git push origin HEAD:winforms
