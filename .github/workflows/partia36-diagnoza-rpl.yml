name: "Partia 36 - diagnoza RPL i lista 193 lekow bez PDF"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia36
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Diagnose new RPL requests and generate missing medicines list
        run: python scripts/partia36-diagnose-rpl.py
      - name: Save all 193 missing medicine names and safe verified updates
        shell: bash
        run: |
          mkdir -p data/audyt_brakujacych_pdf
          cp partia36_raport/brakujace_leki_193.csv data/audyt_brakujacych_pdf/partia36_brakujace_leki.csv
          cp partia36_raport/brakujace_leki_193.md data/audyt_brakujacych_pdf/partia36_brakujace_leki.md
          cp partia36_raport/result.json data/audyt_brakujacych_pdf/partia36_wynik.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audyt_brakujacych_pdf/ data/ChPL/RPL/ src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m 'data: partia36 diagnoza RPL lista lekow i zweryfikowane PDF [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia36-nazwy-lekow-i-diagnoza
          path: partia36_raport/
          retention-days: 14
