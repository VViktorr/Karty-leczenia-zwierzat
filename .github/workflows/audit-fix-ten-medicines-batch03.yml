name: Partia 03 - audyt i korekty 10 lekow
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-ten-batch03
  cancel-in-progress: false
jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Audyt 10 lekow i bezpieczne korekty PDF w SQLite
        run: python scripts/audit-fix-ten-medicines-batch03.py
      - name: Zapisz SQLite i raport do GitHub bez kompilacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_10_lekow_partia_03_SQLite.md
          if git diff --cached --quiet; then
            echo 'Brak nowych zmian'
            exit 0
          fi
          git commit -m 'audit: 10 medicines batch03 and verified PDF links [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
