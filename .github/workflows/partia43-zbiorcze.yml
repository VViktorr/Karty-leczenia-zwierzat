name: "Partia 43 - audyt Librela Draxxin Loxicom"
on:
  push:
    branches: [winforms]
    paths: [".github/workflows/partia43-zbiorcze.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia43
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
      - name: Prepare PDF parser
        run: python -m pip install --disable-pip-version-check "pymupdf>=1.24,<3"
      - name: Read real product headings strengths and Subiekt variants
        run: python scripts/partia43-audyt-zbiorcze.py
      - name: Commit report only no SQLite changes
        shell: bash
        run: |
          git diff --exit-code -- src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audyt_brakujacych_pdf/partia43_analiza_trzech_zbiorczych_pdf.json
          git add -f data/audyt_brakujacych_pdf/partia43_warianty_subiekt.csv
          git commit -m 'audit: trzy zbiorcze polskie ChPL wraz z Subiektem [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia43-wynik
          path: |
            data/audyt_brakujacych_pdf/partia43_analiza_trzech_zbiorczych_pdf.json
            data/audyt_brakujacych_pdf/partia43_warianty_subiekt.csv
          retention-days: 14
