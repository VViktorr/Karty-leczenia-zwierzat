name: Etapy 7-9 - kwalifikacja produktów i skróty karencji
on:
  push:
    branches: [winforms]
    paths: [.github/workflows/medicine-cleanup-7-9.yml]
permissions:
  contents: write
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'execute medicine cleanup stages seven to nine')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Etap 7 - potwierdzone nie-leki bez wariantów
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          path='src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          db=sqlite3.connect(path)
          db.execute('PRAGMA foreign_keys=ON')
          targets=('05085','04594','000000000000000474','02714','000003021','000002990')
          result=[]
          with db:
              for sym in targets:
                  row=db.execute('SELECT name,rpl_id,upd_id,status,decision FROM products WHERE symbol=?',(sym,)).fetchone()
                  assert row and not row[1] and not row[2] and row[4] is None,(sym,row)
                  assert row[3].startswith(('Nie lek / inne','Nie jest lekiem')),(sym,row)
                  assert db.execute('SELECT COUNT(*) FROM variants WHERE symbol=?',(sym,)).fetchone()[0]==0,(sym,row)
                  db.execute("UPDATE products SET decision='NOT_MEDICINE' WHERE symbol=?",(sym,))
                  result.append((sym,row[0]))
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
          print('CLASSIFIED_NON_MEDICINES',result)
          print('BAYOFLY_AND_GEOMYCIN_LEFT_UNCHANGED')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet || git commit -m 'data: oznacz potwierdzone produkty nielecznicze bez wariantow [skip ci]'
          git push origin HEAD:winforms
      - name: Etap 9 - nie dotyczy zamiast brak karencji dla psów i kotów
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          p='src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite'
          db=sqlite3.connect(p)
          db.execute('PRAGMA foreign_keys=ON')
          rows=db.execute("""SELECT v.id,v.symbol,v.species,v.edible_tissues,v.milk,v.withdrawal_short,
                    COALESCE(price.compact_text,'') FROM variants v
                    LEFT JOIN price_withdrawal_entries price ON price.id=v.id
                    WHERE LOWER(TRIM(v.species)) IN ('pies','kot')""").fetchall()
          corrected=[]
          with db:
              for id,sym,species,tissue,milk,short,compact in rows:
                  t=(tissue or '').strip().casefold()
                  m=(milk or '').strip().casefold()
                  if not (t.startswith('nie dotyczy') and m.startswith('nie dotyczy')):continue
                  if short=='Nie dotyczy' and compact=='Nie dotyczy':continue
                  # Only format, without editing the full clinical fields.
                  db.execute("UPDATE variants SET withdrawal_short='Nie dotyczy' WHERE id=?",(id,))
                  db.execute('INSERT OR REPLACE INTO price_withdrawal_entries(id,compact_text) VALUES (?,?)',(id,'Nie dotyczy'))
                  corrected.append((id,sym,species))
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
          print('NON_FOOD_SPECIES_SHORT_WITHDRAWAL_CLEANED_COUNT',len(corrected))
          print('CHANGED',corrected[:100])
          PY
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet || git commit -m 'data: skroty karencji dla psow i kotow - nie dotyczy [skip ci]'
          git push origin HEAD:winforms
