name: Korekta 3 lekow - Bioketan Buserelin Carofertin
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-fix-3-batch01
  cancel-in-progress: false
jobs:
  update-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Uruchom korekte 3 lekow i testy integralnosci bazy
        run: python scripts/fix-three-medicines-batch01.py
      - name: Zapisz SQLite (bez kompilacji programu)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo 'Brak nowych zmian danych'
            exit 0
          fi
          git commit -m 'fix: Buserelin i Carofertin schematy RPL - partia 3 lekow [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
