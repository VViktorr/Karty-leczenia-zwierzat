name: Ganapar RPL 35323 - schematy bydla
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-ganapar-rpl35323
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Korekta dwoch wariantow Ganapar na podstawie ChPL
        run: python scripts/fix-ganapar-cattle-indications-rpl35323.py
      - name: Zapis SQLite i raportu bez kompilacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_Ganapar_RPL35323_schematy_2026-11-15.md
          if git diff --cached --quiet; then
            echo 'Brak nowych zmian'
            exit 0
          fi
          git commit -m 'fix: Ganapar cattle indication schedules RPL 35323 [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
