name: "Partia 25 - napraw do 30 oryginalnych PDF RPL i polacz SQLite"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia25
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: "Czytnik PDF"
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: "Usun tylko prefiks XML-XMP i powiaz do 30 ChPL"
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict, Counter
          import hashlib, json, re, sqlite3, unicodedata
          import fitz
          
          root=Path.cwd()
          database=root/"src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite"
          base_sha=hashlib.sha256(database.read_bytes()).hexdigest()
          assert base_sha=="66f376b32f51054190783d883fd9700a957a76a4f73221f281bfc09ccac97c27", "Baza zmienila sie od audytu: przerwij bez zmian"
          db=sqlite3.connect(database)
          db.row_factory=sqlite3.Row
          db.execute("PRAGMA foreign_keys=ON")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          assert db.execute("SELECT COUNT(*) FROM variants").fetchone()[0]==2944
          
          def normalized(v):
              txt=unicodedata.normalize("NFKD",str(v or "").casefold())
              return re.sub(r"[^a-z0-9]+"," ","".join(c for c in txt if not unicodedata.combining(c))).strip()
          def valid(path):
              return path.is_file() and path.read_bytes()[:5]==b"%PDF-"
          def check_pdf(data, name):
              # Confirm a full native PDF, not merely a document with matching text in the filename.
              with fitz.open(stream=data,filetype="pdf") as doc:
                  assert 2<=len(doc)<=100 and not doc.is_encrypted,(name,"unexpected page count / encrypted")
                  text=normalized(" ".join(page.get_text(sort=True) for page in doc))
                  assert len(text)>=300 and "charakterystyk" in text,(name,"missing official SPC text")
                  return text,len(doc)
          
          active=[dict(x) for x in db.execute("SELECT id,rpl_id,name,pdf_path,scope FROM variants WHERE scope IS NULL OR lower(scope) NOT LIKE '%archiwal%'")]
          assert len(active)==2902
          missing=[x for x in active if not str(x["pdf_path"] or "").strip() or not valid(root/str(x["pdf_path"]))]
          assert len(missing)==275,"Zmiana liczby brakow od audytu"
          groups=defaultdict(list)
          for x in missing:
              rpl=str(x["rpl_id"] or "").strip()
              if re.fullmatch(r"\d{4,12}",rpl):groups[rpl].append(x)
          
          fixes=[]
          skipped=Counter()
          for rpl,entries in sorted(groups.items(),key=lambda kv:(-len(kv[1]),kv[0])):
              files=list((root/"data/ChPL/RPL").glob("RPL_"+rpl+"_*.pdf"))
              if len(files)!=1:
                  skipped["brak jednoznacznego pliku RPL"]+=len(entries)
                  continue
              file=files[0]
              orig=file.read_bytes()
              if orig.startswith(b"%PDF-"):
                  try:
                      text,pages=check_pdf(orig,file.name)
                      skipped["plik PDF ma juz poprawny format"]+=len(entries)
                  except:
                      skipped["PDF nieczytelny mimo naglowka PDF"]+=len(entries)
                  continue
              offset=orig.find(b"%PDF-")
              if offset<=0 or offset>262144:
                  skipped["brak naglowka PDF wewnatrz pliku"]+=len(entries)
                  continue
              prefix=orig[:offset]
              # Limit repairs to recognizable extra registry XML/XMP metadata, not arbitrary foreign data.
              sample=prefix[:2048].lower().lstrip(b"\xef\xbb\xbf \r\n\t")
              if not (sample.startswith(b"<?xml") or sample.startswith(b"<x:xmpmeta") or sample.startswith(b"<rdf:rdf")
                      or b"<?xpacket" in sample or b"<x:xmpmeta" in sample):
                  skipped["niezidentyfikowany prefiks przed PDF"]+=len(entries)
                  continue
              clean=orig[offset:]
              try:
                  text,pages=check_pdf(clean,file.name)
              except Exception as exc:
                  skipped["PDF po usunieciu prefiksu nadal niepoprawny"]+=len(entries)
                  continue
              def tokens(name):
                  return [w for w in normalized(name).split() if len(w)>=5 and w not in
                          ("roztwor","proszek","zawiesina","iniekcji","wstrzykiwan","kapsulki","tabletki","tabletke","weterynaryjny")]
              if any(re.search(r"(?i)candidates|kandydac|(?:or|lub)\s+[0-9]{4,}",str(x["name"])) for x in entries):
                  skipped["niejednoznaczna nazwa"]+=len(entries)
                  continue
              if not all(tokens(x["name"]) and re.search(r"\b"+re.escape(tokens(x["name"])[0])+r"\b",text) for x in entries):
                  skipped["nazwa wariantu nie zgadza sie z ChPL"]+=len(entries)
                  continue
              fixes.append({"rpl":rpl,"file":file,"data":clean,"offset":offset,"pages":pages,
                            "entries":entries,"oldsha":hashlib.sha256(orig).hexdigest(),"original":orig})
              if len(fixes)==30:break
          
          reportdir=Path("partia25_raport")
          reportdir.mkdir(exist_ok=True)
          result={"before_missing":275,"source_sha256":base_sha,"groups_selected":len(fixes),
                  "variants_selected":sum(len(x["entries"]) for x in fixes),
                  "skipped_variants_by_reason":dict(skipped),
                  "selection":[{"rpl":x["rpl"],"file":x["file"].relative_to(root).as_posix(),
                               "variants":[row["id"] for row in x["entries"]],
                               "removed_prefix_bytes":x["offset"],"pages":x["pages"],
                               "pdf_sha_before":x["oldsha"]} for x in fixes]}
          if not fixes:
              result["status"]="no_safe_pdf_repairs"
              (reportdir/"result.json").write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding="utf8")
              print("PARTIA25_RESULT",json.dumps(result,ensure_ascii=False))
          else:
              # Repair original PDF content ONLY by removing registry metadata preceding its %PDF signature.
              # Save the exact native PDF suffix unchanged. On any DB failure, restore all bytes.
              try:
                  for x in fixes:
                      assert hashlib.sha256(x["file"].read_bytes()).hexdigest()==x["oldsha"]
                      x["file"].write_bytes(x["data"])
                  db.execute("BEGIN IMMEDIATE")
                  for x in fixes:
                      path=x["file"].relative_to(root).as_posix()
                      db.execute("INSERT OR IGNORE INTO documents(path) VALUES (?)",(path,))
                      for row in x["entries"]:
                          previous=db.execute("SELECT rpl_id,pdf_path FROM variants WHERE id=?",(row["id"],)).fetchone()
                          assert previous and str(previous["rpl_id"])==x["rpl"]
                          assert str(previous["pdf_path"] or "").strip()==str(row["pdf_path"] or "").strip()
                          old=str(previous["pdf_path"] or "").strip()
                          # Ten sam plik zostal naprawiony w tym przebiegu: przed naprawa nie byl prawidlowym PDF.
                          if old==path:
                              assert not x["original"].startswith(b"%PDF-"),"Nie wolno nadpisac uprzednio poprawnego PDF"
                          else:
                              assert not old or not valid(root/old),"Nie nadpisuj istniejacego prawidlowego PDF"
                          cur=db.execute("UPDATE variants SET pdf_path=? WHERE id=? AND rpl_id=?",(path,row["id"],x["rpl"]))
                          assert cur.rowcount==1
                  assert db.execute("SELECT COUNT(*) FROM variants").fetchone()[0]==2944
                  assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
                  assert not db.execute("PRAGMA foreign_key_check").fetchall()
                  db.commit()
              except:
                  db.rollback()
                  for x in fixes:
                      # Restore exactly the previous unmodified bytes.
                      x["file"].write_bytes(x["original"])
                      # original bytes must not be guessed; fail job and leave workspace uncommitted.
                  raise
              result["status"]="updated"
              result["after_missing"]=275-result["variants_selected"]
              result["sqlite_sha_after"]=hashlib.sha256(database.read_bytes()).hexdigest()
              print("PARTIA25_RESULT",json.dumps(result,ensure_ascii=False))
              (reportdir/"result.json").write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding="utf8")
          db.close()
          
          PY
      - name: "Commit PDF i SQLite tylko jesli wystapily bezpieczne poprawki"
        run: |
          if [ ! -f partia25_raport/result.json ]; then
            echo 'Raport nie powstal - przerywam'
            exit 1
          fi
          if grep -q '"status": "no_safe_pdf_repairs"' partia25_raport/result.json; then
            echo 'Nie znaleziono dokumentow nadajacych sie do bezpiecznej naprawy; SQLite bez zmian'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/ChPL/RPL/
          git diff --cached --quiet && { echo 'Brak zmian'; exit 1; }
          git commit -m 'fix: partia 25 naprawa ChPL XMP i powiazanie z wariantami [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia25-raport-napraw
          path: partia25_raport/
          retention-days: 14
