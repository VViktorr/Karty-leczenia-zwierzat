name: Audyt trzech lekow - Bioketan Buserelin Carofertin
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-audit-three-batch01
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Odczytaj trzy grupy wariantow i sprawdz integralnosc SQLite
        run: python scripts/audit-bioketan-buserelin.py
      - name: Zapisz raport bez kompilacji programu
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audyt_Bioketan_Buserelin_Carofertin_SQLite.md
          if git diff --cached --quiet; then
            echo 'Raport bez zmian'
            exit 0
          fi
          git commit -m 'audit: three medicines Bioketan Buserelin Carofertin [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
