name: Partia 50 - Coxevac i Equilis Prequenza-Te
on:
  push:
    branches: [winforms]
    paths: ['.github/workflows/partia50-pdf.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf==1.26.6'
      - name: Verify three PDFs and restore exact Coxevac and Equilis variants
        run: python scripts/partia50-coxevac-equilis.py
      - name: Commit SQLite and audit report without application build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia50_equilis_coxevac.json
          git commit -m "data: link verified Equilis and Coxevac Polish ChPLs [skip ci]"
          git fetch origin winforms
          git rebase origin/winforms
          git push origin HEAD:winforms
