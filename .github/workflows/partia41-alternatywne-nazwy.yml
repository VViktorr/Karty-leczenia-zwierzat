name: "Partia 41 - alternatywne nazwy leku w ChPL"
on:
  push:
    branches: [winforms]
    paths:
      - ".github/workflows/partia41-alternatywne-nazwy.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia41
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
      - name: PDF text parser
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Scan official Polish/English SPC names including alternate trade names
        run: python scripts/partia41-alternatywne-nazwy-chpl.py
      - name: Commit safe SQLite links and names in Subiekt audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia41_wynik.json
          git add -f data/audyt_brakujacych_pdf/partia41_nazwy_subiekt_kandydaci.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: partia41 dopasowania nazw alternatywnych z ChPL [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia41-alternatywne-nazwy
          path: |
            data/audyt_brakujacych_pdf/partia41_wynik.json
            data/audyt_brakujacych_pdf/partia41_nazwy_subiekt_kandydaci.csv
          retention-days: 14
