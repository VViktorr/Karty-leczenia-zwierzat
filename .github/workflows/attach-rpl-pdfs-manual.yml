name: RPL - uzupelnij powiazania PDF (partia 01)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-rpl-pdf
  cancel-in-progress: false
jobs:
  update-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Weryfikuj i uzupelnij PDF w SQLite
        run: python scripts/attach-missing-rpl-pdfs-batch01.py --apply
      - name: Zapisz baze tylko jesli zmieniona
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo "Brak nowych powiazan PDF."
            exit 0
          fi
          git commit -m 'fix: uzupelnij oryginalne PDF RPL dla 4 produktow [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
