name: Calciphos RPL 20485 - schemat powtarzania dawek
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-calciphos-dose-fix
  cancel-in-progress: false
jobs:
  fix-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Zmien 12 dawek Calciphos z kontrola danych i integralnosci
        run: python scripts/fix-calciphos-rpl20485-repeat-doses.py --apply
      - name: Commit aktualnej SQLite bez kompilacji programu
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo 'Baza bez nowych zmian'
            exit 0
          fi
          git commit -m 'fix: Calciphos RPL 20485 doprecyzuj powtarzanie dawek [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
