name: Dodatkowe porzadkowanie wariantow bez zmiany karencji
on:
  push:
    branches: [winforms]
    paths:
      - '.github/workflows/medicine-cleanup-safe-2.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'start safe medicine cleanup part two')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Etap 4 — archiwalne pozwolenie Tetradur
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite')
          db.execute('PRAGMA foreign_keys=ON')
          rows=db.execute("""SELECT v.id,p.symbol,p.status,v.species,v.scope FROM variants v
            JOIN products p ON p.symbol=v.symbol WHERE UPPER(p.name) LIKE 'TETRADUR LA-300%'""").fetchall()
          assert len(rows)==4,rows
          assert all('Archiwalny' in (r[2] or '') and 'surrendered' in r[2].lower() for r in rows),rows
          with db:
              for id,symbol,status,species,scope in rows:
                  db.execute("UPDATE variants SET scope=? WHERE id=?",("Archiwalne — pozwolenie wycofane w Polsce",id))
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not db.execute('PRAGMA foreign_key_check').fetchall()
          print('TETRADUR_ARCHIVED', [r[0] for r in rows])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet || git commit -m 'fix: nie pokazuj archiwalnego Tetradur jako aktywnego leku [skip ci]'
          git push origin HEAD:winforms
      - name: Etap 5 — uproszczenie nieadekwatnych karencji Pyoctanina
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite')
          db.execute('PRAGMA foreign_keys=ON')
          products=db.execute("SELECT symbol FROM products WHERE rpl_id='18792' AND UPPER(name) LIKE 'PYOCTANINA 3%'").fetchall()
          assert len(products)==3,products
          horse=[]
          pets=[]
          archived=[]
          with db:
              for (symbol,) in products:
                  rows=db.execute("SELECT id,species,edible_tissues,milk FROM variants WHERE symbol=? AND rpl_id='18792' ORDER BY id",(symbol,)).fetchall()
                  hs=[r for r in rows if r[1].strip().lower()=='koń']
                  assert len(hs)==1,rows
                  assert hs[0][2]=='0 dni' and 'Nie podano' in (hs[0][3] or ''),hs
                  id=hs[0][0]
                  db.execute("UPDATE variants SET withdrawal_short=? WHERE id=?",('tk. 0 dni',id))
                  db.execute("UPDATE price_withdrawal_entries SET compact_text=? WHERE id=?",('tk. 0 dni',id))
                  horse.append(id)
                  for species in ('pies','kot'):
                      same=[r for r in rows if r[1].strip().lower()==species]
                      assert len(same)==2,(symbol,species,same)
                      # Both catalogue variants refer to same animal species and topical route.
                      for r in same:
                          db.execute("UPDATE variants SET withdrawal_short=? WHERE id=?",('Nie dotyczy',r[0]))
                          db.execute("UPDATE price_withdrawal_entries SET compact_text=? WHERE id=?",('Nie dotyczy',r[0]))
                          pets.append(r[0])
                      db.execute("UPDATE variants SET scope=? WHERE id=?",('Archiwalne — scalony duplikat gatunku',same[1][0]))
                      archived.append(same[1][0])
          assert len(horse)==3 and len(pets)==12 and len(archived)==6
          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          assert not db.execute('PRAGMA foreign_key_check').fetchall()
          print('PYOCTANINA_HORSE_SHORT',horse,'PETS_REWRITTEN',pets,'ARCHIVED_DUPLICATES',archived)
          PY
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet || git commit -m 'fix: czytelne skroty karencji i bez duplikatow Pyoctanina [skip ci]'
          git push origin HEAD:winforms
