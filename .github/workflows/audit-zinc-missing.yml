name: Audyt i czyszczenie katalogu - etap 6
on:
  push:
    branches: [winforms]
    paths: [.github/workflows/audit-zinc-missing.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raport duplikatow i pustych kartotek
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,json,collections
          db=sqlite3.connect("file:src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite?mode=ro",uri=True)
          db.row_factory=sqlite3.Row
          print("REPORT_BEGIN")
          for r in db.execute("SELECT symbol,name,rpl_id,status,decision FROM products WHERE UPPER(name) LIKE '%ZINCI%'"):
            print("ZINC_PRODUCT",json.dumps(dict(r),ensure_ascii=False))
            for v in db.execute("SELECT id,species,route,edible_tissues,milk,withdrawal_short,scope,indication,restrictions FROM variants WHERE symbol=? ORDER BY id",(r['symbol'],)):
              print("ZINC_VARIANT",json.dumps(dict(v),ensure_ascii=False))
          q="""SELECT p.symbol,p.name,p.rpl_id,p.upd_id,p.status,p.decision
                FROM products p WHERE NOT EXISTS(SELECT 1 FROM variants v WHERE v.symbol=p.symbol)
                ORDER BY p.name"""
          missing=[dict(r) for r in db.execute(q)]
          print("MISSING_COUNT",len(missing))
          for r in missing:
            print("NO_VARIANTS",json.dumps(r,ensure_ascii=False))
            base=r['name'].upper().split(' A\'')[0].strip()
            key=base.split(' ')[0]
            alt=[dict(x) for x in db.execute("""SELECT p.symbol,p.name,p.rpl_id,COUNT(v.id) AS n 
              FROM products p JOIN variants v ON v.symbol=p.symbol WHERE UPPER(p.name) LIKE ? 
              GROUP BY p.symbol ORDER BY n DESC LIMIT 5""",(key+'%',))]
            print("SIBLINGS",json.dumps({'symbol':r['symbol'],'candidate':alt},ensure_ascii=False))
          print("REPORT_END")
          print("Audit ready")
          PY
