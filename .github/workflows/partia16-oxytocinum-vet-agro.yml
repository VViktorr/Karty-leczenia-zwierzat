name: "Partia 16 - Oxytocinum Vet-Agro RPL 20383 18 wariantow"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medcatalog-oxytocinum-partia16
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: "Koryguj tylko 18 zidentyfikowanych wariantow Vet-Agro"
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, sqlite3, json, re
          p=pathlib.Path("src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite")
          pdfpath="data/ChPL/RPL/RPL_20383_Oxytocinum_10_j_m_RPL_ChPL.pdf"
          pdf=pathlib.Path(pdfpath)
          assert pdf.is_file() and pdf.read_bytes().startswith(b"%PDF-"),"ChPL RPL 20383 musi być poprawnym plikiem PDF"
          base=hashlib.sha256(p.read_bytes()).hexdigest()
          db=sqlite3.connect(p)
          db.row_factory=sqlite3.Row
          db.execute("PRAGMA foreign_keys=ON")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          assert db.execute("SELECT COUNT(*) FROM variants").fetchone()[0]==2944
          cols={r[1] for r in db.execute("PRAGMA table_info(variants)")}
          required={"id","name","rpl_id","species","route","dose","card_text","edible_tissues","milk","pdf_path","scope"}
          assert required<=cols,required-cols
          ids=list(range(2198,2216))
          rows=[dict(r) for r in db.execute("SELECT * FROM variants WHERE id BETWEEN 2198 AND 2215 ORDER BY id")]
          assert [x["id"] for x in rows]==ids
          assert all(str(x["rpl_id"])=="16987" for x in rows),"RPL przypisano już inaczej, wymagana ponowna ocena"
          assert all("oxytocinum" in str(x["name"]).casefold() and "10 j.m." in str(x["name"]).casefold() for x in rows)
          assert all(str(x["species"]).casefold()=="bydło" and "archiwal" not in str(x["scope"] or "").casefold() for x in rows)
          assert all(not x["pdf_path"] for x in rows),"Istniejące PDF nie mogą zostać nadpisane bez analizy"
          for x in rows:
              assert re.search(r"(20\s*[–-]\s*40|5\s*[–-]\s*10)",str(x["dose"])),"Nieoczekiwana dotychczasowa dawka ID "+str(x["id"])
          print("DANE_WEJSCIOWE",json.dumps([{"id":x["id"],"name":x["name"],"route":x["route"],"dose":x["dose"],"edible_tissues":x["edible_tissues"],"milk":x["milk"],"card_text":str(x["card_text"] or "")[:200]} for x in rows],ensure_ascii=False))
          # All variants concern cattle. Vet-Agro ChPL: IM/SC 10-60 IU (1-6 ml), IV reduce by 50%.
          def revised_dose(route):
              r=str(route).casefold()
              if any(x in r for x in ("dożyln", "iv", "i.v.")):
                  assert not any(x in r for x in ("podskór", "domięśni")),r
                  return "5–30 j.m. (0,5–3 ml) dożylnie, tj. 50% dawki domięśniowej/podskórnej; w razie potrzeby powtórzyć nie wcześniej niż po 20 minutach."
              if any(x in r for x in ("domięśni", "im", "i.m.")):
                  return "10–60 j.m. (1–6 ml) domięśniowo; w razie potrzeby powtórzyć nie wcześniej niż po 20 minutach."
              if any(x in r for x in ("podskór", "sc", "s.c.")):
                  return "10–60 j.m. (1–6 ml) podskórnie; w razie potrzeby powtórzyć nie wcześniej niż po 20 minutach."
              raise ValueError("Nieznana droga podania: "+str(route))
          out=[]
          for x in rows:
              newdose=revised_dose(x["route"])
              olddose=str(x["dose"] or "")
              card=str(x["card_text"] or "")
              newcard=card
              if olddose and olddose in newcard:
                  newcard=newcard.replace(olddose,newdose)
              else:
                  # Existing card may contain abbreviated dosing; replace only numerical references 
                  # where explicit, and keep every other indication/detail unchanged.
                  newcard=re.sub(r"20\s*[–-]\s*40\s*j\.?m\.?\s*\(?2\s*[–-]\s*4\s*ml\)?", "10–60 j.m. (1–6 ml)",newcard,flags=re.I)
                  newcard=re.sub(r"5\s*[–-]\s*10\s*j\.?m\.?\s*\(?0[,.]5\s*[–-]\s*1\s*ml\)?", "5–30 j.m. (0,5–3 ml)",newcard,flags=re.I)
              if re.search(r"(20\s*[–-]\s*40|5\s*[–-]\s*10)\s*j\.?m",newcard,re.I):
                  raise ValueError("Przestarzała dawka w card_text wariantu "+str(x["id"]))
              # Ensure the new information is always explicit on the card.
              if newdose not in newcard:
                  newcard=(newcard.rstrip()+"\nDawkowanie wg ChPL Oxytocinum Vet-Agro: "+newdose).strip()
              new_tissues="0 dni"
    new_milk="0 godzin"
              changes={"name":"Oxytocinum 10 j.m./ml Vet-Agro","rpl_id":"20383","dose":newdose,
                       "card_text":newcard,"edible_tissues":new_tissues,"milk":new_milk,"pdf_path":pdfpath}
              if "withdrawal_short" in cols: changes["withdrawal_short"]="Tkanki: 0 dni; mleko: 0 godz."
              out.append((x,changes))
          # Update only 18 rows, preserving identifiers, symbols, species, indications and other clinical fields.
          try:
              db.execute("BEGIN IMMEDIATE")
              db.execute("INSERT OR IGNORE INTO documents(path) VALUES (?)",(pdfpath,))
              for old,values in out:
                  sets=", ".join(k+"=?" for k in values)
                  cur=db.execute("UPDATE variants SET "+sets+" WHERE id=? AND rpl_id='16987' AND (pdf_path IS NULL OR TRIM(pdf_path)='')",[*values.values(),old["id"]])
                  assert cur.rowcount==1,old["id"]
              after=[dict(r) for r in db.execute("SELECT * FROM variants WHERE id BETWEEN 2198 AND 2215 ORDER BY id")]
              assert all(str(x["rpl_id"])=="20383" and x["pdf_path"]==pdfpath for x in after)
              assert db.execute("SELECT count(*) FROM variants").fetchone()[0]==2944
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert not db.execute("PRAGMA foreign_key_check").fetchall()
              db.commit()
              print("ZMIENIONO",len(out),"wariantow RPL 20383:",ids)
              print("SQLite before",base,"after",hashlib.sha256(p.read_bytes()).hexdigest())
          except:
              db.rollback()
              raise
          finally:
              db.close()
          PY
      - name: "Zapisz SQLite bez budowania aplikacji"
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet && { echo 'Brak zmian'; exit 1; }
          git commit -m 'fix: Oxytocinum Vet-Agro RPL 20383 dla 18 wariantow [skip ci]'
          git push origin HEAD:winforms
