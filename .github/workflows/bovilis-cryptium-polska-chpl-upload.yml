name: "Bovilis Cryptium - dolacz przeslana polska ChPL 2024"
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  link_pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
      - name: Install pymupdf
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Verify uploaded PDF and update six SQLite records
        shell: bash
        run: |
          cat > /tmp/attach-bovilis.py <<'PY'
          from pathlib import Path
          import fitz,sqlite3,hashlib,json,unicodedata,re
          root=Path.cwd()
          pdf=root/"data/ChPL/UPD/UPD_600000992040_Bovilis_Cryptium_UPD_ChPL.pdf"
          dbfile=root/"src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite"
          reportdir=Path("bovilis-pdf-raport");reportdir.mkdir(exist_ok=True)
          expected_pdf="d3826ff712a18bf6d2383d1bb34de337353397bbdd7a1d966f0f0fb706e00b2e"
          expected_db="eacdcae1499788e5e6b91be8c673add00d88e200f3c1d0530d016805e43183b4"
          assert pdf.is_file(),"Brak oryginalnego PDF; najpierw umiesc plik w data/ChPL/UPD/"
          assert hashlib.sha256(pdf.read_bytes()).hexdigest()==expected_pdf,"Plik nie odpowiada zweryfikowanemu zalacznikowi"
          assert hashlib.sha256(dbfile.read_bytes()).hexdigest()==expected_db,"SQLite zmieniona: wymagany ponowny audyt"
          with fitz.open(pdf) as doc:
              assert len(doc)==21 and not doc.is_encrypted
              text="\n".join(page.get_text() for page in doc)
          for phrase in ("CHARAKTERYSTYKA WETERYNARYJNEGO PRODUKTU LECZNICZEGO","Bovilis Cryptium",
                         "EU/2/23/303/001-005","Podanie podskórne","Zero dni"):
              assert phrase in text, f"Niepotwierdzone {phrase}"
          connection=sqlite3.connect(dbfile)
          connection.row_factory=sqlite3.Row
          connection.execute("PRAGMA foreign_keys=ON")
          assert connection.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not connection.execute("PRAGMA foreign_key_check").fetchall()
          assert connection.execute("SELECT count(*) FROM variants").fetchone()[0]==2944
          ids=[1091,1092,1093,1094,1095,1096]
          cols=[x[1] for x in connection.execute("PRAGMA table_info(variants)") if x[1]!="pdf_path"]
          def clinical_digest():
              sql="SELECT "+",".join('"'+x+'"' for x in cols)+" FROM variants ORDER BY id"
              return hashlib.sha256(json.dumps([list(x) for x in connection.execute(sql)],ensure_ascii=False,default=str).encode()).hexdigest()
          before=clinical_digest()
          rows=connection.execute("SELECT id,name,rpl_id,upd_id,pdf_path,scope FROM variants WHERE id IN (?,?,?,?,?,?) ORDER BY id",ids).fetchall()
          assert [r["id"] for r in rows]==ids
          for row in rows:
              assert str(row["rpl_id"])=="100490423" and str(row["upd_id"])=="600000992040"
              assert "bovilis cryptium" in row["name"].lower()
              assert "archiwal" not in str(row["scope"] or "").lower()
              old=str(row["pdf_path"] or "").strip()
              assert not old or not ((root/old).is_file() and (root/old).open("rb").read(5)==b"%PDF-"),"Chron istniejący dobry PDF"
          rel=pdf.relative_to(root).as_posix()
          try:
              connection.execute("BEGIN IMMEDIATE")
              connection.execute("INSERT OR IGNORE INTO documents(path) VALUES(?)",(rel,))
              for id_ in ids:
                  c=connection.execute("UPDATE variants SET pdf_path=? WHERE id=? AND rpl_id=? AND upd_id=?",
                                       (rel,id_,"100490423","600000992040"))
                  assert c.rowcount==1
              assert clinical_digest()==before
              assert connection.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert not connection.execute("PRAGMA foreign_key_check").fetchall()
              connection.commit()
          except:
              connection.rollback()
              raise
          assert clinical_digest()==before
          missing=connection.execute("SELECT count(*) FROM variants WHERE (scope IS NULL OR lower(scope) NOT LIKE '%archiwal%') AND (pdf_path IS NULL OR trim(pdf_path)='')").fetchone()[0]
          result={"status":"linked","variants":6,"ids":ids,"source_sha256":expected_pdf,
                  "clinical_unchanged":True,"sqlite_sha256":hashlib.sha256(dbfile.read_bytes()).hexdigest(),
                  "missing_empty_links_remaining":missing}
          (reportdir/"result.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf8")
          print("BOVILIS_UPLOAD_RESULT",json.dumps(result,ensure_ascii=False))
          connection.close()
          PY
          python -m py_compile /tmp/attach-bovilis.py
          python /tmp/attach-bovilis.py
      - name: Commit only verified SQLite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m 'fix: polska ChPL Bovilis Cryptium 2024 powiaz 6 wariantow [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bovilis-chpl-przeslany-pdf-raport
          path: bovilis-pdf-raport/
          retention-days: 14
