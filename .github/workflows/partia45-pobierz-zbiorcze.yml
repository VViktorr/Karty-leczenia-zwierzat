name: Partia 45 - pobierz polskie zbiorcze ChPL EMA
on:
  push:
    branches: [winforms]
    paths: ['.github/workflows/partia45-pobierz-zbiorcze.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pobierz-i-powiaz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf==1.26.6'
      - name: Pobierz i zweryfikuj polskie zbiorcze ChPL, powiaz zatwierdzone
        run: python scripts/partia45-pobierz-zbiorcze-ema.py
      - name: Zapisz PDF, SQLite i raport bez testow aplikacji
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/ChPL/UPD/ema-combined-*.pdf src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia45_zbiorcze_ema_wynik.json
          if ! git diff --cached --quiet; then
            git commit -m "data: add official combined Polish EMA PDFs and safe links [skip ci]"
            git fetch origin winforms
            git rebase origin/winforms
            git push origin HEAD:winforms
          fi

# Retry with European Commission Union Register Previcox PDF.
