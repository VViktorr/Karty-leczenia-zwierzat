name: "Partia 32 - klasyfikacja brakow i potwierdzone polskie ChPL"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia32
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF inspection
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Classify backlog and safely link confirmed documents
        run: python scripts/partia32-classify-chpl.py
      - name: Commit SQLite changes only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo "No fully verified links: SQLite unchanged."
            exit 0
          fi
          git commit -m 'fix: partia 32 verified Polish ChPL PDF links [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia32-klasyfikacja-pdf
          path: partia32_raport/
          retention-days: 14
