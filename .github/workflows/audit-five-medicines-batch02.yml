name: Audyt 5 lekow - partia 02
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-audit-five-batch02
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Zapisz audyt pieciu lekow z aktualnej SQLite
        run: python scripts/audit-five-medicines-batch02.py
      - name: Zapisz wynik bez kompilacji programu
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audyt_5_lekow_partia_02_SQLite.md
          if git diff --cached --quiet; then
            echo 'Raport bez zmian'
            exit 0
          fi
          git commit -m 'audit: five medicines Ataxxa Biocan Duphalyte Fertigest Ganapar [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
