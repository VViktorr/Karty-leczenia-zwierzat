name: "Partia 28 - zweryfikuj polskie ChPL UPD Bovilis i Nobilis"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-partia28
  cancel-in-progress: false
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: "Sprawdz polski naglowek ChPL i dokladny ID UPD"
        shell: bash
        run: |
          cat > /tmp/partia28.py <<'PY'
          from pathlib import Path
          import hashlib,json,re,sqlite3,unicodedata
          import fitz
          
          ROOT=Path.cwd()
          DB=ROOT/"src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite"
          REPORT=Path("partia28_raport");REPORT.mkdir(exist_ok=True)
          expected_db_hash="eacdcae1499788e5e6b91be8c673add00d88e200f3c1d0530d016805e43183b4"
          assert hashlib.sha256(DB.read_bytes()).hexdigest()==expected_db_hash,"SQLite zmieniona od partii 27"
          targets=[
            {"rpl":"100490423","upd":"600000992040","name":"Bovilis Cryptium","strain":None,
             "pdf":"data/ChPL/UPD/UPD_600000992040_Bovilis_Cryptium_UPD_ChPL.pdf","ids":[1091,1092,1093,1094,1095,1096]},
            {"rpl":"100375501","upd":"600000059826","name":"Nobilis IB 4-91","strain":r"\b4[\s\-]+91\b",
             "pdf":"data/ChPL/UPD/UPD_600000059826_Nobilis_IB_4_-_91_liofilizat_do_sporządzania__UPD_ChPL.pdf",
             "ids":[2517,2518,2519,2520]}
          ]
          def norm(s):
              raw=unicodedata.normalize("NFKD",str(s or "").casefold())
              return re.sub(r"[^a-z0-9]+"," ",".join(c for c in raw if not unicodedata.combining(c))).strip()
          def valid_pdf(p):
              return p.is_file() and p.open("rb").read(5)==b"%PDF-"
          conn=sqlite3.connect(DB)
          conn.row_factory=sqlite3.Row
          conn.execute("PRAGMA foreign_keys=ON")
          assert conn.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not conn.execute("PRAGMA foreign_key_check").fetchall()
          assert conn.execute("SELECT count(*) FROM variants").fetchone()[0]==2944
          clinical_columns=[x[1] for x in conn.execute("PRAGMA table_info(variants)") if x[1]!="pdf_path"]
          def clinical_digest():
              select="SELECT "+",".join('"'+x+'"' for x in clinical_columns)+" FROM variants ORDER BY id"
              values=[list(r) for r in conn.execute(select)]
              return hashlib.sha256(json.dumps(values,ensure_ascii=False,default=str).encode()).hexdigest()
          prior_clinical=clinical_digest()
          outcomes=[]
          approved=[]
          for target in targets:
              outcome={"rpl":target["rpl"],"upd":target["upd"],"name":target["name"],
                       "pdf":target["pdf"],"ids":target["ids"],"status":"rejected","reasons":[]}
              try:
                  path=ROOT/target["pdf"]
                  assert valid_pdf(path),"PDF not valid"
                  assert path.name.startswith("UPD_"+target["upd"]+"_"),"UPD ID mismatch in filename"
                  with fitz.open(path) as document:
                      assert not document.is_encrypted and 2<=len(document)<=100
                      body=norm(" ".join(p.get_text(sort=True) for p in document))
                      outcome["pages"]=len(document)
                  assert len(body)>600,"No meaningful text"
                  # A Polish official SPC must be confirmed in the PDF, rather than an English-only EPAR.
                  assert re.search(r"charakterystyk\w*\s+produkt\w*",body),"Polish ChPL heading not found"
                  assert "weterynaryjn" in body or "leczniczego weterynaryjnego" in body,"Veterinary SPC wording absent"
                  assert re.search(r"\b"+r"\s+".join(map(re.escape,norm(target["name"]).split()))+r"\b",body),"Product name absent"
                  if target["strain"]:
                      assert re.search(target["strain"],body),"Strain code absent from SPC"
                  records=conn.execute("SELECT id,name,rpl_id,upd_id,pdf_path,scope FROM variants WHERE id IN ("+",".join("?" for _ in target["ids"])+") ORDER BY id",target["ids"]).fetchall()
                  assert len(records)==len(target["ids"])
                  for row in records:
                      assert row["rpl_id"]==target["rpl"] and str(row["upd_id"] or "").strip()==target["upd"],"Variant ID mismatch"
                      assert "archiwal" not in str(row["scope"] or "").casefold(),"Archived variant"
                      assert norm(target["name"]).split()[0] in norm(row["name"]),"Variant product name mismatch"
                      prior=str(row["pdf_path"] or "").strip()
                      assert not prior or not valid_pdf(ROOT/prior),"Will not overwrite valid PDF"
                  outcome["status"]="approved"
                  approved.append(target)
              except Exception as exc:
                  outcome["reasons"].append(type(exc).__name__+": "+str(exc)[:180])
              outcomes.append(outcome)
          
          if approved:
              try:
                  conn.execute("BEGIN IMMEDIATE")
                  for t in approved:
                      conn.execute("INSERT OR IGNORE INTO documents(path) VALUES (?)",(t["pdf"],))
                      for id_ in t["ids"]:
                          change=conn.execute("UPDATE variants SET pdf_path=? WHERE id=? AND rpl_id=? AND upd_id=?",(t["pdf"],id_,t["rpl"],t["upd"]))
                          assert change.rowcount==1
                  assert clinical_digest()==prior_clinical,"Unexpected modification to clinical data"
                  assert conn.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
                  assert not conn.execute("PRAGMA foreign_key_check").fetchall()
                  conn.commit()
              except:
                  conn.rollback()
                  raise
          assert clinical_digest()==prior_clinical
          assert conn.execute("SELECT count(*) FROM variants").fetchone()[0]==2944
          active=[r for r in conn.execute("SELECT pdf_path FROM variants WHERE scope IS NULL OR lower(scope) NOT LIKE '%archiwal%'")]
          remaining=sum(not str(r["pdf_path"] or "").strip() or not valid_pdf(ROOT/str(r["pdf_path"])) for r in active)
          expected_after=257-sum(len(x["ids"]) for x in approved)
          assert remaining==expected_after,(remaining,expected_after)
          result={"before_missing":257,"after_missing":remaining,"linked":257-remaining,
                  "approved_groups":len(approved),"sqlite_before":expected_db_hash,
                  "sqlite_after":hashlib.sha256(DB.read_bytes()).hexdigest(),
                  "clinical_unchanged":True,"outcomes":outcomes}
          (REPORT/"result.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PARTIA28_RESULT",json.dumps(result,ensure_ascii=False))
          conn.close()
          PY
          python -m py_compile /tmp/partia28.py
          python /tmp/partia28.py
      - name: "Zapisz jedynie zweryfikowane powiazania PDF"
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite
          if git diff --cached --quiet; then
            echo "Brak wystarczajaco potwierdzonych ChPL; baza pozostala bez zmian"
            exit 0
          fi
          git commit -m 'fix: partia 28 powiaz polskie ChPL UPD po walidacji [skip ci]'
          git push origin HEAD:winforms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partia28-raport-weryfikacji
          path: partia28_raport/
          retention-days: 14
