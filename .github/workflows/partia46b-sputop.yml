name: Partia 46b - poprawny Sputop ChPL
on:
  push:
    branches: [winforms]
    paths:
      - '.github/workflows/partia46b-sputop.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf==1.26.6'
      - name: Pobierz ChPL Sputop i popraw 12 sciezek
        run: python scripts/partia46b-sputop-zoetis.py
      - name: Zapisz PDF i raport na winforms bez kompilacji
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/ChPL/RPL/RPL_20339_Sputop_Spot_On_Zoetis_ChPL_2024-03.pdf src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_brakujacych_pdf/partia46b_sputop_poprawny_pdf.json
          git commit -m "data: replace invalid Sputop XMP links with verified Polish Zoetis ChPL [skip ci]"
          git fetch origin winforms
          git rebase origin/winforms
          git push origin HEAD:winforms
