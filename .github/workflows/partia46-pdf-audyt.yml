name: Partia 46 - weryfikacja nowych PDF bez kompilacji
on:
  push:
    branches: [winforms]
    paths: ['.github/workflows/partia46-pdf-audyt.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  weryfikacja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pymupdf==1.26.6'
      - name: Zweryfikuj nowy PDF Sputop i policz aktualne braki SQLite
        run: python scripts/partia46-sprawdz-dodane-pdf.py
      - name: Zapisz raport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/audyt_brakujacych_pdf/partia46_nowy_sputop_audyt.json
          git commit -m "audit: validate Sputop ChPL and remaining PDF gaps [skip ci]"
          git fetch origin winforms
          git rebase origin/winforms
          git push origin HEAD:winforms

