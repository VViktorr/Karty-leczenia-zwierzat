name: Rispoval Vivum - 2 warianty RPL 22647
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medicine-catalog-rispoval-vivum-rpl22647
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: winforms
          persist-credentials: true
      - name: Popraw schematy szczepienia Rispoval w SQLite
        run: python scripts/fix-rispoval-vivum-rpl22647.py
      - name: Zapisz SQLite i raport bez kompilacji
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/KartyLeczenia/Resources/Raw/medicine-catalog.sqlite data/audyt_Rispoval_IBR_Vivum_RPL22647_partia_08.md
          if git diff --cached --quiet; then
            echo 'Brak nowych zmian'
            exit 0
          fi
          git commit -m 'fix: Rispoval IBR Vivum RPL22647 detailed schedules [skip ci]'
          git pull --rebase origin winforms
          git push origin HEAD:winforms
